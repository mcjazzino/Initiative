/* ---------- end of combat: what changed, so the player can copy it to their sheet ---------- */
function snapState() {
  const ch = CH();
  return {
    hp: { ...ch.hp },
    slots: JSON.parse(JSON.stringify(ch.slots || {})),
    res: Object.fromEntries(Object.values(ch.res || {}).map(r => [r.k, { n: r.n, cur: r.cur, max: r.max }])),
    items: Object.fromEntries((ch.items || []).filter(i => i.q != null).map(i => [i.n, i.q])),
    insp: !!ch.insp,
    exhaust: S.cond.exhaust || 0,
    conds: condList().map(c => c.n),
    conc: S.conc || null,
    ward: ch.ward ? ch.ward.cur : null,
    pets: Object.fromEntries(pets().map(p => [p.id, { n: p.n, cur: petState(p).cur, max: p.max }]))
  };
}
function snapStart() {
  if (!S.snap || S.snap.char !== CH().name) S.snap = { ...snapState(), char: CH().name };
}
// one line per change, worded as what to do on the sheet
function combatDiff() {
  const a = S.snap,
    b = snapState(),
    ch = CH(),
    L = [];
  if (!a) return L;
  const add = (k, what, todo) => L.push({ k, what, todo });
  if (a.hp.cur !== b.hp.cur || a.hp.max !== b.hp.max)
    add(
      'hp',
      `Hit points: ${a.hp.cur} → <b>${b.hp.cur}</b> of ${b.hp.max}`,
      b.hp.cur < a.hp.cur
        ? `Write down ${b.hp.cur} HP (${a.hp.cur - b.hp.cur} damage taken)`
        : `Write down ${b.hp.cur} HP (${b.hp.cur - a.hp.cur} healed)`
    );
  if ((a.hp.temp || 0) !== (b.hp.temp || 0))
    add(
      'temp',
      `Temporary HP: ${a.hp.temp || 0} → <b>${b.hp.temp || 0}</b>`,
      b.hp.temp ? 'They last until you use them or take a long rest' : 'None left'
    );
  const keys = [...new Set([...Object.keys(a.slots), ...Object.keys(b.slots)])].sort();
  keys.forEach(k => {
    const x = a.slots[k] || { used: 0, max: 0 },
      y = b.slots[k] || { used: 0, max: 0 };
    if (x.used === y.used) return;
    const nm = k === 'P' ? `Pact slots (level ${y.lvl || x.lvl})` : `Level ${k} spell slots`,
      d = y.used - x.used;
    add(
      'slot' + k,
      `${nm}: ${y.max - y.used} of ${y.max} left`,
      d > 0 ? `Mark ${d} more as used` : `${-d} recovered: unmark ${-d}`
    );
  });
  Object.entries(b.res).forEach(([k, y]) => {
    const x = a.res[k];
    if (!x || x.cur === y.cur) return;
    const d = x.cur - y.cur;
    add(
      'res' + k,
      `${esc(y.n)}: ${x.cur} → <b>${y.cur}</b> of ${y.max}`,
      d > 0 ? `Mark ${d} spent` : `${-d} regained`
    );
  });
  Object.entries(b.items).forEach(([n, q]) => {
    const p = a.items[n];
    if (p == null || p === q) return;
    add('item' + n, `${esc(n)}: ${p} → <b>${q}</b>`, q < p ? `Cross off ${p - q}` : `Add ${q - p}`);
  });
  if (a.insp !== b.insp)
    add(
      'insp',
      `${is14('insp') ? 'Inspiration' : 'Heroic Inspiration'}: <b>${b.insp ? 'you have it' : 'used'}</b>`,
      b.insp ? 'Mark it on your sheet' : 'Clear it on your sheet'
    );
  if (a.exhaust !== b.exhaust)
    add('exh', `Exhaustion: ${a.exhaust} → <b>${b.exhaust}</b>`, 'Update your exhaustion level');
  if (b.conds.length)
    add('cond', `Still on you: <b>${esc(b.conds.join(', '))}</b>`, 'Note them if they last beyond the fight');
  if (b.conc)
    add(
      'conc',
      `Still concentrating on <b>${esc(b.conc)}</b>`,
      'It keeps going after the fight; note how long it has left'
    );
  if (S.dying)
    add(
      'dying',
      S.dying.dead
        ? '<b>You died</b>'
        : S.dying.stable
          ? '<b>Stable at 0 HP</b>'
          : '<b>Unconscious at 0 HP</b>',
      S.dying.dead ? 'Talk to your DM about what happens next' : 'You need healing to get back up'
    );
  if (a.ward != null && b.ward != null && a.ward !== b.ward)
    add(
      'ward',
      `Arcane Ward: ${a.ward} → <b>${b.ward}</b>`,
      'Note it if your table tracks the ward between fights'
    );
  Object.entries(b.pets || {}).forEach(([id, p]) => {
    const was = a.pets && a.pets[id];
    if (was && was.cur !== p.cur)
      add('pet' + id, `${esc(p.n)}: ${was.cur} → <b>${p.cur}</b> of ${p.max} HP`, p.cur ? `Write down ${p.cur} HP for ${esc(p.n)}` : `${esc(p.n)} dropped to 0 HP`);
  });
  return L;
}
let SHEETDONE = {};
function endAskSheet() {

Object.assign(ACT, {

  },

  },

/* ---------- companions: familiars, pets, mounts and battle companions ----------
   ch.pets = what the character has (from D&D Beyond's Extras, from class features, or added by hand):
     { id, n, what, kind: 'turn' | 'own' | 'mount', ac, max, speed, atk: [{ n, hit, dmg, note }], notes: [], cmd: 'B' | '' }
       turn  = acts right after you on your initiative (battle companions); cmd 'B' = commanding it costs your Bonus Action
       own   = rolls its own initiative (familiars, pets)
       mount = a creature you ride: while ridden it acts on your initiative, and can only Dash, Disengage or Dodge
   S.pets = this fight and since the last rest: { id: { cur, away } } */
const PET_KIND = {
  turn: 'Acts right after you',
  own: 'Its own turn',
  mount: 'Mount'
};
// D&D Beyond Extras → companions (group 1 is Wild Shape forms: not companions)
function parsePets(d) {
  const spells = JSON.stringify(d.classSpells || []) + JSON.stringify(d.spells || {});
  const hasFamiliar = /Find Familiar/.test(spells);
  return (d.creatures || [])
    .filter(c => c.groupId !== 1 && c.definition)
    .map(c => {
      const df = c.definition,
        name = c.name || df.name,
        mv = { 1: '', 2: 'burrow ', 3: 'climb ', 4: 'fly ', 5: 'swim ' },
        speed = (df.movements || []).map(m => `${mv[m.movementId] || ''}${m.speed} ft`).join(', '),
        plain = h =>
          String(h || '')
            .replace(/<[^>]+>/g, ' ')
            .replace(/&nbsp;/g, ' ')
            .replace(/&minus;|−/g, '-')
            .replace(/\s+/g, ' ')
            .trim();
      const acts = plain(df.actionsDescription),
        atk = [];
      const re =
        /([A-Z][\w' ()-]{1,40})\.\s*(Melee|Ranged|Melee or Ranged)(?: Weapon| Spell)? Attack(?: Roll)?:\s*\+(\d+)(?: to hit)?,\s*(?:reach|range)\s*([^.,]+?)(?:\.|,)[^]*?Hit:\s*(\d+)(?:\s*\(([^)]+)\))?\s*(\w+)\s*damage/gi;
      let m;
      while ((m = re.exec(acts))) atk.push({ n: m[1].trim(), hit: +m[3], dmg: m[6] ? m[6].replace(/\s+/g, '') : m[5], type: m[7].toLowerCase(), range: m[4].trim() });
      const fam = c.groupId === 2 || c.groupId === 3 ? hasFamiliar || /familiar/i.test(c.description || '') : false;
      const kind = c.groupId === 4 ? 'mount' : 'own';
      const notes = [];
      if (fam) notes.push("A familiar can't attack. It can Help, and deliver your touch spells (using your Reaction).");
      if (kind === 'mount') notes.push('While you ride it, it moves on your turn and can only Dash, Disengage or Dodge.');
      return {
        id: 'ddb' + c.id,
        n: name,
        what: name !== df.name ? df.name : '',
        kind,
        ac: df.armorClass,
        max: df.averageHitPoints,
        cur0: Math.max(0, df.averageHitPoints - (c.removedHitPoints || 0)),
        speed,
        atk: fam ? [] : atk,
        notes,
        acts: atk.length ? '' : acts.slice(0, 300),
        cmd: ''
      };
    });
}
// companions from class features (built characters)
function featurePets() {
  const ch = CH(),
    L = [],
    mods = ch.mods6 || [0, 0, 0, 0, 0, 0],
    prof = ch.prof || 2;
  const sub = n => ((ch.classes || []).find(c => c.n === n) || {}).sub || '';
  const art = clsLvl('Artificer'),
    rng = clsLvl('Ranger');
  if (art >= 3 && /Battle Smith/i.test(sub('Artificer')))
    L.push({
      id: 'f-defender',
      n: 'Steel Defender',
      kind: 'turn',
      cmd: 'B',
      ac: 15,
      max: 2 + mods[3] + 5 * art,
      speed: '40 ft',
      atk: [{ n: 'Force-Empowered Rend', hit: prof + mods[3], dmg: `1d8+${prof}`, type: 'force', range: '5 ft' }],
      notes: [
        'Reaction: Deflect Attack — a creature it can see attacks someone within 5 ft of it: impose disadvantage.',
        'Repair (3/day): it or an object regains 2d8+' + prof + ' HP.',
        "If you don't command it, it takes the Dodge action."
      ]
    });
  if (rng >= 3 && /Beast Master/i.test(sub('Ranger')))
    L.push({
      id: 'f-beast',
      n: 'Primal Companion',
      kind: 'turn',
      cmd: 'B',
      ac: 13 + mods[4],
      max: 5 + 5 * rng,
      speed: '40 ft (climb 40 ft as Beast of the Land)',
      atk: [{ n: "Beast's Strike", hit: prof + mods[4], dmg: `1d8+${2 + mods[4]}`, type: 'piercing or slashing', range: '5 ft' }],
      notes: [
        'Land, Sea or Sky beast: pick the form on your sheet.',
        "If you don't command it, it takes the Dodge action."
      ]
    });
  return L;
}
function pets() {
  const ch = CH();
  return [...(ch.pets || []), ...(ch.source === 'ddb' ? [] : featurePets()), ...(ch.myPets || []), ...(famPet() ? [famPet()] : [])];
}
function petState(p) {
  S.pets = S.pets || {};
  if (!S.pets[p.id]) S.pets[p.id] = { cur: p.cur0 != null ? p.cur0 : p.max, away: false };
  return S.pets[p.id];
}
const petsOut = () => pets().filter(p => !petState(p).away);
// the strip above End Turn: only when a companion is out
function petStrip(where) {
  const L = petsOut();
  if (!L.length) return '';
  return `<div class="petstrip">${L.map(p => {
    const st = petState(p),
      down = st.cur <= 0;
    const what =
      p.kind === 'turn'
        ? `Acts after you${p.cmd === 'B' ? ' · command: Bonus Action' : ''}`
        : p.kind === 'mount'
          ? `Mount · ${p.speed.split(',')[0]}`
          : where === 'off'
            ? 'Its own turn: tap when it acts'
            : 'Its own turn';
    return `<button class="petbar ${down ? 'down' : ''}" data-act="petOpen" data-arg="${p.id}"><span class="pn">${esc(p.n)}</span><span class="php">${down ? 'Down' : `${st.cur}/${p.max} HP`}</span><span class="pw">${what}</span></button>`;
  }).join('')}</div>`;
}
function petSheet(id) {
  const p = pets().find(x => x.id === id);
  if (!p) return '<div class="empty">This companion is gone.</div>';
  const st = petState(p),
    c = C(),
    myTurn = c.phase === 'turn';
  const cmd =
    p.cmd === 'B'
      ? myTurn
        ? c.flags['cmd_' + id]
          ? '<div class="tag ok" style="margin-top:10px">Commanded this turn</div>'
          : `<button class="btn pri" style="margin-top:10px" data-act="petCmd" data-arg="${id}" ${c.bonus ? '' : 'disabled'}>Command it (Bonus Action)</button>${c.bonus ? '' : '<div class="sm mut" style="margin-top:6px">Your Bonus Action is used: it takes the Dodge action.</div>'}`
        : '<div class="sm mut" style="margin-top:10px">On your turn, command it with your Bonus Action. Otherwise it takes the Dodge action.</div>'
      : '';
  return `<div class="row between" style="gap:10px"><div><div class="sm mut">${esc([p.what, PET_KIND[p.kind]].filter(Boolean).join(' · '))}</div>
    <div class="sm mut" style="margin-top:2px">AC <b style="color:var(--txt)">${p.ac}</b> · Speed ${esc(p.speed || '—')}</div></div></div>
  <div class="hpbig" style="margin-top:6px">${st.cur}<span class="mut" style="font-size:20px"> / ${p.max}</span></div>
  <input class="field" id="petAmt" type="number" inputmode="numeric" placeholder="Damage or healing" style="margin-top:8px;text-align:center;font-size:18px;font-weight:800">
  <div class="stepper" style="grid-template-columns:1fr 1fr"><button data-act="petHp" data-arg="${id}|dmg" style="color:var(--bad)">Damage</button><button data-act="petHp" data-arg="${id}|heal" style="color:var(--ok)">Heal</button></div>
  ${cmd}
  ${p.atk && p.atk.length ? `<div class="xs sec">Attacks</div><div class="card">${p.atk.map(a => `<div class="wpn"><div><b>${esc(a.n)}</b><div class="sm mut">${esc(a.range || '')}</div></div><div style="text-align:right"><div style="color:var(--acc);font-weight:800">+${a.hit}</div><div class="sm">${esc(a.dmg)} ${esc(a.type)}</div></div></div>`).join('')}</div>` : ''}
  ${p.acts ? `<p class="sm mut" style="line-height:1.5;margin-top:10px">${esc(p.acts)}</p>` : ''}
  ${(p.notes || []).map(t => `<div class="rnote">${esc(t)}</div>`).join('')}
  <button class="btn" style="margin-top:14px" data-act="petAway" data-arg="${id}">Send ${esc(p.n)} away for now</button>`;
}
function petsSheet() {
  const L = pets();
  return `${L.length ? L.map(p => {
    const st = petState(p);
    return `<div class="card row between" style="margin-top:8px;gap:10px"><div><div style="font-weight:800">${esc(p.n)}</div><div class="sm mut">${esc([p.what, PET_KIND[p.kind]].filter(Boolean).join(' · '))} · ${st.cur}/${p.max} HP</div></div>
      ${st.away ? `<button class="btn pri" style="width:auto;padding:8px 14px" data-act="petBack" data-arg="${p.id}">Bring out</button>` : `<button class="btn" style="width:auto;padding:8px 14px" data-act="petOpen" data-arg="${p.id}">Open</button>`}</div>`;
  }).join('') : '<p class="sm mut" style="line-height:1.5">No companions yet. Characters from D&amp;D Beyond bring the ones on their Extras tab. You can add one here too.</p>'}
  ${canFamiliar() ? `<button class="btn" style="margin-top:10px" data-act="famAsk" data-arg="${feats().some(f => /^Wild Companion$/i.test(f.n)) && !(CH().spells || []).some(s => s.n === 'Find Familiar') ? '1' : '0'}">${S.fam ? 'Change your familiar' : 'Your familiar: choose its form'}</button>` : ''}
  <details class="rcat" style="margin-top:14px"><summary>Add a companion</summary>
   <input class="field" id="pN" placeholder="Name, e.g. Pip the owl" style="margin-top:8px">
   <div class="row" style="gap:8px;margin-top:8px"><input class="field" id="pAC" type="number" inputmode="numeric" placeholder="AC"><input class="field" id="pHP" type="number" inputmode="numeric" placeholder="HP"><input class="field" id="pSp" placeholder="Speed"></div>
   <select class="field" id="pK" style="margin-top:8px"><option value="own">Takes its own turn (familiar, pet)</option><option value="turn">Acts after me, commanded with my Bonus Action</option><option value="turnfree">Acts after me, no command needed (summoned)</option><option value="mount">A mount I ride</option></select>
   <div class="row" style="gap:8px;margin-top:8px"><input class="field" id="pAn" placeholder="Attack (optional)"><input class="field" id="pAh" type="number" inputmode="numeric" placeholder="+hit" style="max-width:80px"><input class="field" id="pAd" placeholder="Damage" style="max-width:110px"></div>
   <button class="btn pri" style="margin-top:8px" data-act="petAdd">Add companion</button>
  </details>
  ${(CH().myPets || []).length ? `<div class="sm mut" style="margin-top:10px">Companions you added: ${(CH().myPets || []).map(p => `${esc(p.n)} <button class="iconbtn" style="width:26px;height:26px;display:inline-grid" data-act="petDel" data-arg="${p.id}" aria-label="Remove">✕</button>`).join(' ')}</div>` : ''}`;
}
// hpSheet: when companions are out, the hit may have been theirs
function petHitChooser() {
  const L = petsOut();
  if (!L.length) return '';
  return `<div class="sm mut" style="text-align:center;margin-bottom:8px">Did a companion take the hit?</div><div class="row" style="gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px">${L.map(p => `<button class="tag" style="padding:7px 12px" data-act="petOpen" data-arg="${p.id}">${esc(p.n)} · ${petState(p).cur}/${p.max}</button>`).join('')}</div>`;
}
let PET_OPEN = '';
Object.assign(ACT, {
  pets() {
    openSheet('Companions', petsSheet);
  },
  petOpen(id) {
    PET_OPEN = id;
    const p = pets().find(x => x.id === id);
    (sheetFn ? pushSheet : openSheet)(p ? p.n : 'Companion', () => (sheetFn && sheetStack && sheetStack.length ? '<button class="backlink" data-act="back">‹ Back</button>' : '') + petSheet(PET_OPEN));
  },
  petHp(arg) {
    const [id, mode] = arg.split('|'),
      p = pets().find(x => x.id === id),
      v = Math.max(0, parseInt(($('#petAmt') || {}).value) || 0);
    if (!p || !v) return toast('Type an amount first');
    const st = petState(p);
    st.cur = mode === 'dmg' ? Math.max(0, st.cur - v) : Math.min(p.max, st.cur + v);
    if (id === 'fam' && !st.cur) {
      S.fam = null;
      delete S.pets.fam;
      save();
      closeSheet();
      render();
      return toast(`<b>${esc(p.n)} vanishes</b><br><span class="mut">Cast Find Familiar again to bring it back</span>`);
    }
    save();
    render();
    toast(mode === 'dmg' ? (st.cur ? `${esc(p.n)} takes ${v}: ${st.cur}/${p.max} HP` : `<b>${esc(p.n)} drops to 0 HP</b>`) : `${esc(p.n)} heals ${v}: ${st.cur}/${p.max} HP`);
  },
  petCmd(id) {
    const p = pets().find(x => x.id === id);
    if (!p || !C().bonus) return;
    if (!spend('B', 'Command ' + p.n)) return;
    C().flags['cmd_' + id] = true;
    save();
    render();
    toast(`${esc(p.n)} acts right after you this turn`);
  },
  petAway(id) {
    const p = pets().find(x => x.id === id);
    petState(p).away = true;
    save();
    closeSheet();
    render();
    toast(`${esc(p.n)} is away. Bring them back from the menu → Companions`);
  },
  petBack(id) {
    const p = pets().find(x => x.id === id);
    petState(p).away = false;
    save();
    render();
  },
  petAdd() {
    const n = ($('#pN').value || '').trim();
    if (!n) return toast('Give your companion a name');
    const k = $('#pK').value,
      an = ($('#pAn').value || '').trim();
    const ch = CH();
    ch.myPets = ch.myPets || [];
    const max = Math.max(1, +$('#pHP').value || 1);
    ch.myPets.push({
      id: 'my' + Date.now().toString(36),
      n,
      what: '',
      kind: k === 'turnfree' ? 'turn' : k,
      cmd: k === 'turn' ? 'B' : '',
      ac: +$('#pAC').value || 10,
      max,
      speed: ($('#pSp').value || '').trim() || '30 ft',
      atk: an ? [{ n: an, hit: +$('#pAh').value || 0, dmg: ($('#pAd').value || '').trim() || '—', type: '', range: '' }] : [],
      notes: k === 'mount' ? ['While you ride it, it moves on your turn and can only Dash, Disengage or Dodge.'] : []
    });
    save();
    render();
    toast(`${esc(n)} joins you`);
  },
  petDel(id) {
    const ch = CH();
    ch.myPets = (ch.myPets || []).filter(p => p.id !== id);
    if (S.pets) delete S.pets[id];
    save();
    render();
  }
});

/* ---------- familiars: Find Familiar and the druid's Wild Companion ----------
   Casting Find Familiar or using Wild Companion asks for the familiar's form; it then joins the
   companions (S.fam). A familiar can't attack; it vanishes at 0 HP. A Wild Companion familiar
   (5.5e) is a Fey and leaves when you finish a Long Rest. */
const FAM_FORMS = [
  ['Bat', 12, 1, '5 ft, fly 30 ft', 'Blindsight 60 ft.'],
  ['Cat', 12, 2, '40 ft, climb 40 ft', 'Keen smell.'],
  ['Frog', 11, 1, '20 ft, swim 20 ft', 'Breathes air and water; standing jump 10 ft.'],
  ['Hawk', 13, 1, '10 ft, fly 60 ft', 'Keen sight.'],
  ['Lizard', 10, 2, '20 ft, climb 20 ft', 'Darkvision 30 ft; climbs walls.'],
  ['Octopus', 12, 3, '5 ft, swim 30 ft', 'Can squeeze through tiny gaps; ink cloud once.'],
  ['Owl', 11, 1, '5 ft, fly 60 ft', "Flyby: doesn't provoke opportunity attacks when it flies away. Darkvision 120 ft."],
  ['Rat', 10, 1, '20 ft, climb 20 ft', 'Darkvision 30 ft; keen smell.'],
  ['Raven', 12, 2, '10 ft, fly 50 ft', 'Mimicry: imitates simple sounds and voices.'],
  ['Spider', 12, 1, '20 ft, climb 20 ft', 'Walks on walls and webs; senses through webs.'],
  ['Weasel', 13, 1, '30 ft, climb 30 ft', 'Keen hearing and smell.']
];
const canFamiliar = () =>
  (CH().spells || []).some(s => s.n === 'Find Familiar') || feats().some(f => /^Wild Companion$/i.test(f.n));
function famPet() {
  const f = S.fam;
  if (!f) return null;
  const F = FAM_FORMS.find(x => x[0] === f.form) || FAM_FORMS[6];
  return {
    id: 'fam',
    n: f.name || F[0],
    what: `Familiar · ${F[0]}${f.fey ? ' (Fey)' : ''}`,
    kind: 'own',
    ac: F[1],
    max: F[2],
    speed: F[3],
    atk: [],
    notes: [
      F[4],
      "A familiar can't attack. On its own turn it can Help, Dodge, Hide or move.",
      'When you cast a touch spell, it can deliver it for you (its Reaction) if it is within 100 ft.',
      f.fey ? 'It leaves when you finish a Long Rest.' : 'At 0 HP it vanishes; cast Find Familiar again to bring it back.'
    ],
    cmd: ''
  };
}
function famPickSheet() {
  return `<p class="sm mut" style="line-height:1.5;margin:0 0 12px">Which form does your familiar take?</p>
  <div class="uagrid">${FAM_FORMS.map(f => `<button data-act="famPick" data-arg="${f[0]}">${f[0]}</button>`).join('')}</div>
  <input class="field" id="famName" placeholder="Its name (optional)" style="margin-top:12px">`;
}
let FAM_FEY = false;
Object.assign(ACT, {
  famAsk(fey) {
    FAM_FEY = fey === true || fey === '1';
    (sheetFn ? pushSheet : openSheet)('Your familiar', famPickSheet);
  },
  famPick(form) {
    const name = (($('#famName') || {}).value || '').trim();
    S.fam = { form, name, fey: FAM_FEY };
    S.pets = S.pets || {};
    S.pets.fam = { cur: (FAM_FORMS.find(x => x[0] === form) || [0, 0, 1])[2], away: false };
    save();
    closeSheet();
    render();
    toast(`${esc(name || form)} appears beside you`);
  }
});
// after Wild Companion or Find Familiar is used, ask for the form
(() => {
  const use0 = ACT.use,
    castAt0 = ACT.castAt;
  const ask = (o, before) => {
    if (!o || JSON.stringify(S) === before) return;
    if (/^Wild Companion$/i.test(o.n)) ACT.famAsk(true);
    else if (o.n === 'Find Familiar') ACT.famAsk(false);
  };
  ACT.use = function (id) {
    const o = findAny(id),
      before = JSON.stringify(S);
    const r = use0.apply(this, arguments);
    if (o && o.lvl === undefined) ask(o, before);
    return r;
  };
  ACT.castAt = function (arg) {
    const o = spells().find(x => x._id === String(arg).split('|')[0]),
      before = JSON.stringify(S);
    const r = castAt0.apply(this, arguments);
    ask(o, before);
    return r;
  };
})();

// everything is defined: draw the first screen
acMigrate(S && S.char);
render();

</script>
