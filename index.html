<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Initiative — D&amp;D Combat Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --acc:#4A62E8; --ink:#fff; --soft:rgba(74,98,232,.16); --line:rgba(74,98,232,.45);
  --bg:#0d0c11; --card:#17151d; --card2:#1f1c27; --txt:#efeaf4; --mut:#9a93a6; --dim:#5e586a;
  --ok:#3fcf8e; --warn:#f2b84b; --bad:#f2545b;
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#050507;color:var(--txt);font-family:Manrope,system-ui,sans-serif}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
input,textarea{font:inherit;color:var(--txt)}
#shell{max-width:440px;margin:0 auto;min-height:100%;position:relative;overflow:hidden;
  background:radial-gradient(120% 60% at 50% -10%, var(--soft), transparent 60%), var(--bg);
  padding:calc(env(safe-area-inset-top) + 14px) 16px calc(env(safe-area-inset-bottom) + 110px);
  transition:background .4s}
@media (min-width:500px){#shell{margin:20px auto;min-height:860px;border-radius:38px;border:1px solid #26232e;box-shadow:0 30px 80px rgba(0,0,0,.6)}}
.display{font-family:Cinzel,serif;letter-spacing:.02em}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.mut{color:var(--mut)} .sm{font-size:12.5px} .xs{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.card{background:var(--card);border:1px solid #26232e;border-radius:var(--r);padding:14px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:var(--card2);border:1px solid #2c2836;font-weight:700;font-size:13.5px}
.pill svg{width:15px;height:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border-radius:16px;font-weight:800;font-size:15.5px;background:var(--card2);border:1px solid #2c2836}
.btn svg{width:18px;height:18px;flex:none}
.btn.pri{background:var(--acc);color:var(--ink);border:0;box-shadow:0 10px 30px -8px var(--acc)}
.btn.ghost{background:transparent}
.btn.sm{padding:10px 12px;font-size:13.5px;border-radius:12px;width:auto}
.btn:active,.tile:active,.chip:active{transform:scale(.98)}
.btn[disabled]{opacity:.4}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--card);border:1px solid #26232e}
.iconbtn svg{width:20px;height:20px}
.badge{width:46px;height:46px;border-radius:14px;background:var(--acc);color:var(--ink);display:grid;place-items:center;font-family:Cinzel,serif;font-weight:800;font-size:20px;flex:none;box-shadow:0 6px 20px -6px var(--acc)}
.badge svg{width:24px;height:24px}
/* economy */
.econ{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.chip{border-radius:14px;padding:10px 8px;text-align:center;border:1.5px solid var(--line);background:var(--soft);transition:.2s}
.chip b{display:block;font-size:13px}
.chip span{font-size:10.5px;color:var(--mut);font-weight:600}
.chip.used{border-color:#2c2836;background:transparent;opacity:.55}
.chip.used b{text-decoration:line-through;text-decoration-thickness:2px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--acc);display:inline-block;margin-right:5px;box-shadow:0 0 10px var(--acc)}
.chip.used .dot{background:var(--dim);box-shadow:none}
/* movement */
.move{position:relative;overflow:hidden}
.move .big{font-family:Cinzel,serif;font-size:40px;font-weight:800;line-height:1}
.bar{height:10px;border-radius:99px;background:#26232e;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .35s}
.squares{display:flex;flex-wrap:wrap;gap:4px;margin-top:10px}
.sq{width:calc((100% - 44px)/12);aspect-ratio:1;border-radius:4px;background:transparent;border:1.5px solid #3a3545}
.sq.f{background:var(--acc);border-color:var(--acc)}
.sq.dash{border-style:dashed;border-color:var(--line)}
.sq.dash.f{border-style:solid;border-color:var(--acc)}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.tile{position:relative;text-align:left;border-radius:var(--r);padding:14px;background:var(--card);border:1px solid #26232e;min-height:104px;display:flex;flex-direction:column;justify-content:space-between;transition:.15s}
.tile .ic{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--acc)}
.tile .ic svg{width:20px;height:20px}
.tile b{font-size:15.5px}
.tile .sub{font-size:12px;color:var(--mut);font-weight:600}
.tile.off{opacity:.5}
.status{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;background:var(--card2);border:1px solid #2c2836;color:var(--mut);letter-spacing:.03em}
.tag.a{background:var(--soft);border-color:var(--line);color:var(--txt)}
.tag.warn{color:var(--warn);border-color:rgba(242,184,75,.4);background:rgba(242,184,75,.08)}
.tag.ok{color:var(--ok);border-color:rgba(63,207,142,.4);background:rgba(63,207,142,.08)}
.dock{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(env(safe-area-inset-bottom) + 14px);max-width:440px;margin:0 auto;background:linear-gradient(transparent,var(--bg) 30%);z-index:5}
@media (min-width:500px){.dock{bottom:20px;border-radius:0 0 38px 38px}}
/* home */
.hero{text-align:center;padding:26px 10px 10px}
.hero .badge{width:84px;height:84px;border-radius:26px;font-size:36px;margin:0 auto 14px}
.startbtn{position:relative;width:100%;padding:24px;border-radius:24px;background:var(--acc);color:var(--ink);font-family:Cinzel,serif;font-weight:800;font-size:21px;letter-spacing:.04em;box-shadow:0 18px 50px -12px var(--acc);overflow:hidden}
.startbtn:after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.28) 50%,transparent 70%);transform:translateX(-100%);animation:sheen 3.2s infinite}
@keyframes sheen{60%,100%{transform:translateX(100%)}}
.classgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cg{padding:10px 4px;border-radius:12px;background:var(--card2);border:1.5px solid transparent;font-size:11px;font-weight:700;text-align:center}
.cg i{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;margin:0 auto 6px;border:2px solid;font-style:normal;font-size:12px;font-weight:800;line-height:1}
.cg.on{border-color:var(--acc)}
/* sheet */
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.25s;z-index:20}
#scrim.on{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:440px;margin:0 auto;max-height:88vh;background:#141219;border-radius:26px 26px 0 0;border-top:1px solid #2c2836;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.25,1),visibility 0s .32s;visibility:hidden;z-index:21;display:flex;flex-direction:column}
#sheet.on{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.2,.9,.25,1)}
#sheet .grab{width:42px;height:5px;border-radius:9px;background:#3a3545;margin:10px auto 4px}
#sheet header{padding:6px 18px 10px;display:flex;align-items:center;justify-content:space-between}
#sheet header h2{margin:0;font-family:Cinzel,serif;font-size:21px}
#sbody{overflow:auto;padding:0 16px calc(env(safe-area-inset-bottom) + 22px)}
.sec{margin:16px 0 8px;color:var(--mut)}
.item{background:var(--card);border:1px solid #26232e;border-radius:15px;padding:12px 12px 12px 14px;margin-bottom:8px}
.item.dis{opacity:.45}
.item .t{font-weight:800;font-size:15px}
.item .d{font-size:12.8px;color:var(--mut);margin-top:4px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.unclamp .item .d{display:block;-webkit-line-clamp:unset}
.uagrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.uagrid button{padding:12px 6px;border-radius:12px;background:var(--card2);border:1px solid #2c2836;font-weight:700;font-size:13.5px;color:var(--txt)}
.uagrid button.off{opacity:.45}
.cost{font-size:10px;font-weight:800;letter-spacing:.06em;padding:3px 7px;border-radius:6px;text-transform:uppercase;white-space:nowrap}
.cost.A{background:var(--soft);color:var(--acc);border:1px solid var(--line)}
.cost.B{background:rgba(242,184,75,.12);color:var(--warn)}
.cost.R{background:rgba(120,170,255,.12);color:#8fb6ff}
.cost.F,.cost.I,.cost.O{background:#25222d;color:var(--mut)}
.use{flex:none;padding:9px 14px;border-radius:11px;background:var(--acc);color:var(--ink);font-weight:800;font-size:13px}
.use.sec2{background:var(--card2);color:var(--txt);border:1px solid #2c2836}
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.stepper button{padding:14px 0;border-radius:13px;background:var(--card2);border:1px solid #2c2836;font-weight:800;font-size:15px}
.stepper button.neg{color:var(--mut)}
.toggle{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid #26232e;margin-top:8px;font-weight:700;font-size:14px}
.sw{width:46px;height:28px;border-radius:99px;background:#2c2836;position:relative;transition:.2s;flex:none}
.sw:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--acc)} .sw.on:after{left:21px}
.slots{display:flex;flex-direction:column;gap:7px}
.slotrow{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700}
.slotrow .lv{width:54px;color:var(--mut)}
.pip{width:20px;height:20px;border-radius:6px;border:2px solid var(--acc);background:var(--acc);transform:rotate(45deg) scale(.8)}
.pip.u{background:transparent;border-color:#3a3545}
.filters{display:flex;gap:6px;overflow:auto;margin:12px 0 4px}
.filters button{padding:7px 12px;border-radius:99px;background:var(--card2);border:1px solid #2c2836;font-size:12.5px;font-weight:700;white-space:nowrap}
.filters button.on{background:var(--acc);color:var(--ink);border-color:transparent}
.lvl{width:26px;height:26px;border-radius:8px;background:var(--card2);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--mut);flex:none}
.upcast{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.upcast button{padding:7px 11px;border-radius:10px;background:var(--soft);border:1px solid var(--line);font-weight:800;font-size:12.5px}
.field{width:100%;padding:13px 14px;border-radius:13px;background:var(--card);border:1px solid #2c2836;outline:none}
.field:focus{border-color:var(--acc)}
textarea.field{min-height:120px;font-family:ui-monospace,monospace;font-size:12px}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:14px;background:var(--card);border:1.5px solid #26232e;margin-bottom:7px;font-weight:700}
.opt.on{border-color:var(--acc);background:var(--soft)}
.opt small{display:block;color:var(--mut);font-weight:600;margin-top:2px}
.suggest{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.suggest button{padding:7px 10px;border-radius:10px;background:var(--card2);border:1px solid #2c2836;font-size:12px;font-weight:600}
/* off-turn */
.react{border-radius:22px;padding:20px;text-align:center;border:1.5px solid var(--line);background:radial-gradient(100% 120% at 50% 0%,var(--soft),var(--card) 70%)}
.react .ring{width:72px;height:72px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;border:3px solid var(--acc);box-shadow:0 0 30px -4px var(--acc), inset 0 0 20px -6px var(--acc);animation:pulse 2.4s infinite}
.react .ring svg{width:32px;height:32px;color:var(--acc)}
.react.used{border-color:#2c2836;background:var(--card)}
.react.used .ring{border-color:#3a3545;box-shadow:none;animation:none}
.react.used .ring svg{color:var(--dim)}
@keyframes pulse{50%{box-shadow:0 0 44px 0 var(--acc), inset 0 0 20px -6px var(--acc)}}
.held{border-radius:var(--r);padding:14px;background:linear-gradient(135deg,var(--soft),transparent 70%),var(--card);border:1.5px solid var(--line);margin-bottom:9px}
.held .trig{font-size:15px;font-weight:800;margin:6px 0 2px}
.empty{padding:16px;border-radius:15px;border:1.5px dashed #2c2836;text-align:center;color:var(--mut);font-size:13px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translate(-50%,40px);opacity:0;pointer-events:none;background:#24202c;border:1px solid #39344a;padding:11px 16px;border-radius:14px;font-weight:700;font-size:13.5px;z-index:40;transition:.3s;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.5)}
#toast.on{transform:translate(-50%,0);opacity:1}
.hpbig{font-family:Cinzel,serif;font-size:46px;font-weight:800;text-align:center}
.atkpips{display:flex;gap:5px}
.atkpips i{width:12px;height:12px;border-radius:4px;background:var(--acc)}
.atkpips i.u{background:#2c2836}
.wpn{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid #26232e;font-size:13.5px}
.wpn:first-child{border-top:0}
.wpn b{font-size:14px}
.num{font-family:Cinzel,serif;font-weight:800}
a{color:var(--acc)}
.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 36px;font-size:13.5px;line-height:1.5;color:var(--mut)}
.steps li b{color:var(--txt)}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:24px;height:24px;border-radius:8px;background:var(--soft);color:var(--acc);display:grid;place-items:center;font-weight:800;font-size:12px}
code{font-size:11.5px;background:#25222d;padding:2px 5px;border-radius:5px;word-break:break-all}

.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg);border:1px solid #26232e;border-radius:15px;padding:4px;gap:4px}
.seg button{padding:10px 6px;border-radius:11px;font-weight:800;font-size:13.5px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;transition:.2s}
.seg button small{font-size:10.5px;font-weight:700;opacity:.75}
.seg button.on{background:var(--acc);color:var(--ink);box-shadow:0 6px 18px -8px var(--acc)}
.seg.mini{margin-top:9px}.seg.mini button{padding:7px 4px;font-size:12.5px}
.rule{background:var(--card);border:1px solid #26232e;border-radius:15px;padding:12px 14px;margin-bottom:8px}
.rule.custom{border-color:rgba(242,184,75,.45)}
.rule .t{font-weight:800;font-size:14.5px}
.rule .d{font-size:12.6px;color:var(--mut);margin-top:8px;line-height:1.45}
.edbadge{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:5px 9px;border-radius:99px;background:var(--card2);border:1px solid #2c2836;color:var(--mut)}
.edbadge svg{width:13px;height:13px}
.edbadge .hb{color:var(--warn)}
.banner{padding:11px 13px;border-radius:13px;background:rgba(242,184,75,.09);border:1px solid rgba(242,184,75,.4);color:var(--warn);font-size:13px;font-weight:600}
.banner b{color:var(--txt)}
.ic2{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:var(--soft);color:var(--acc)}
.ic2 svg{width:20px;height:20px}

.wsframe{position:relative;padding-top:44px;margin-bottom:4px}
.wsframe .ghost{position:absolute;top:0;left:12px;right:12px;display:flex;justify-content:space-between;align-items:center;padding:8px 10px 22px;border-radius:16px 16px 0 0;background:var(--card);border:1px solid #2c2836;opacity:.6}
.beastcard{position:relative;border-radius:22px;padding:14px;background:radial-gradient(120% 90% at 100% 0%,var(--soft),transparent 65%),linear-gradient(165deg,#191f17,#141219 70%);border:1.5px solid var(--line);box-shadow:0 -12px 24px -14px rgba(0,0,0,.9),0 22px 44px -24px var(--acc)}
.beastcard.anim{animation:wsin .5s cubic-bezier(.2,.9,.25,1)}
@keyframes wsin{from{transform:translateY(-14px) scale(.97);opacity:0}}
.wsribbon{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--acc)}
.wsribbon svg{width:14px;height:14px}
.beastic{width:54px;height:54px;border-radius:16px;background:var(--acc);color:var(--ink);display:grid;place-items:center;flex:none;box-shadow:0 8px 24px -8px var(--acc)}
.beastic svg{width:30px;height:30px}
.hpbar{display:block;width:100%;text-align:left;margin-top:14px;padding:10px 12px;border-radius:14px;background:rgba(0,0,0,.28);border:1px solid #2c2836}
.spd{padding:7px 11px;border-radius:99px;font-weight:700;font-size:12.5px;background:var(--card2);border:1px solid #2c2836}
.spd.on{background:var(--soft);border-color:var(--acc)}
.flash{animation:flash 1s}
@keyframes flash{30%{border-color:var(--acc);box-shadow:0 0 0 3px var(--soft)}}
button.react{color:inherit;font:inherit}
.mini-undo{width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;background:var(--card2);border:1px solid #3a3545;color:var(--txt);flex:none;vertical-align:middle;margin-left:6px}
.mini-undo svg{width:15px;height:15px}
.mini-undo:active{transform:scale(.92)}
body.sheet-open #toast{bottom:auto;top:calc(env(safe-area-inset-top) + 12px);transform:translate(-50%,-40px)}
body.sheet-open #toast.on{transform:translate(-50%,0)}
.offcard{border:1.5px solid var(--line);background:var(--soft);border-radius:14px;padding:12px;margin-top:6px}
.offcard.dis{opacity:.5}
.offcard .t{font-weight:800;font-size:14.5px}
.statbox{flex:1;background:var(--card);border:1px solid #26232e;border-radius:13px;padding:9px 10px;text-align:center}
.statbox span{display:block;font-size:10.5px;font-weight:700;color:var(--mut);letter-spacing:.04em;text-transform:uppercase}
.statbox b{font-family:Cinzel,serif;font-size:21px;color:var(--acc)}
.acrow{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid #26232e;font-size:14px}
.acrow:first-of-type{border-top:0}
.acrow b{font-family:Cinzel,serif;color:var(--acc);font-size:16px;flex:none}
.acrow.total{border-top:1.5px solid var(--line);margin-top:4px;font-weight:800}
.acrow.total b{font-size:20px}
.amprow{display:flex;align-items:center;gap:10px;margin-top:10px;padding:10px 12px;border-radius:12px;background:rgba(176,18,47,.10);border:1px dashed rgba(242,84,91,.45);font-size:12.6px;line-height:1.45}
.amprow b{color:var(--bad)}
.faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:8px}
.faces button{aspect-ratio:1;border-radius:14px;background:var(--card2);border:1.5px solid #2c2836;font-family:Cinzel,serif;font-weight:800;font-size:22px}
.faces button:not([disabled]):active{background:var(--acc);color:var(--ink)}
.faces button[disabled]{opacity:.35}
.riteline{display:flex;align-items:center;gap:8px;padding:9px 11px;border-radius:12px;background:var(--soft);border:1px solid var(--line);font-size:13px;margin-bottom:6px}
.riteline svg{width:16px;height:16px;color:var(--acc);flex:none}
.item.tap{cursor:pointer}
.item .more{color:var(--dim);font-weight:700;margin-left:2px}
.backlink{color:var(--acc);font-weight:800;font-size:14px;padding:2px 0 8px}
.swgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.swc{display:flex;flex-direction:column;align-items:center;gap:5px;padding:8px 2px;border-radius:12px;border:1px solid #2c2836;background:var(--card2);color:var(--mut)}
.swc i{width:30px;height:30px;border-radius:50%;display:block}
.swc.on{border-color:var(--acc);color:var(--txt,#fff)}.swc.on i{box-shadow:0 0 0 3px var(--bg,#111),0 0 0 5px var(--acc)}
.setup>summary{font-weight:800}
.rcat.setup{margin-top:10px!important;border:1px solid #2c2836;border-radius:16px;padding:0 15px}
.rcat.setup>summary{padding:15px 0;font-size:15.5px;position:relative;justify-content:center}
.rcat.setup>summary .cclbl{display:flex;align-items:center;gap:8px}.cclbl svg{width:18px;height:18px}
.rcat.setup>summary>span+span{display:none}
.rcat.setup>summary::after{position:absolute;right:0}
.rcat.setup[open]>summary{border-bottom:1px solid #2c2836;margin-bottom:10px}
.setup>summary>span+span{margin-left:12px;text-align:right}
.welcome{padding:18px 2px 0}
.wopt{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:16px;border-radius:18px;background:var(--card);border:1.5px solid #26232e;margin-bottom:10px;color:inherit}
.wopt.pri{border-color:var(--line);background:var(--soft)}
.wopt b{display:block;font-size:16px}.wopt small{display:block;color:var(--mut);font-size:13px;line-height:1.45;margin-top:3px}
.wic{width:42px;height:42px;border-radius:13px;background:var(--card2);display:grid;place-items:center;flex:none;font-size:18px;color:var(--acc)}.wic svg{width:20px;height:20px}
.endc{width:auto;flex:0 0 auto;padding:15px 16px;white-space:nowrap}
.endc.tall{padding:19px 16px}
.chkline{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;padding:13px 14px;border-radius:14px;background:var(--card);border:1.5px solid #26232e;margin-bottom:7px;color:inherit}
.chkline .box{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);flex:none;display:grid;place-items:center;font-weight:900;color:var(--ink)}
.chkline.on .box{background:var(--acc);border-color:var(--acc)}.chkline.on{opacity:.6}
.chkline .w{display:block;font-size:15px}.chkline small{display:block;color:var(--mut);font-size:13px;margin-top:2px}
.condcard{display:block;width:100%;text-align:left;border-color:rgba(242,184,75,.4);margin:10px 0 0;color:inherit}
.hbsteps{display:flex;gap:4px;margin:2px 0 6px}
.hbsteps button{flex:1;padding:7px 2px;border-radius:10px;background:var(--card2);border:1px solid #2c2836;font-size:10.5px;font-weight:700;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px}
.hbsteps button b{font-size:13px}.hbsteps button.on{border-color:var(--acc);color:var(--txt,#fff)}.hbsteps button.on b{color:var(--acc)}.hbsteps button.done b{color:var(--acc)}
.hbab{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hbabc,.hbrow3 .card{text-align:center;padding:10px 6px;margin:0}
.hbnum{width:100%;background:none;border:0;outline:none;text-align:center;font-size:22px;font-weight:800;color:inherit;padding:2px 0;font-family:inherit}
.hbnum:focus{color:var(--acc)}
.hbabc{touch-action:none;user-select:none;-webkit-user-select:none;cursor:ns-resize;position:relative}
.hbabc.drag{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}.hbabc.drag .hbnum{color:var(--acc)}
.hbgrip{display:block;font-style:normal;font-size:8px;line-height:1;color:var(--mut);opacity:.55}
.tag.auto{padding:7px 10px;border:1px solid var(--acc);color:var(--txt);background:color-mix(in srgb,var(--acc) 14%,transparent)}
.hbrow3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.hbsmall{width:52px;padding:7px 6px;border-radius:9px;background:var(--card2);border:1px solid #2c2836;color:inherit;text-align:center;outline:none}
select.field{color:var(--txt,#f3f0f7);-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--mut) 50%),linear-gradient(135deg,var(--mut) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat}
select.field option{background:#1a1720;color:#f3f0f7}
.hbdot{width:14px;height:14px;border-radius:5px;flex:none}
.cdot{width:14px;height:14px;border-radius:50%;background:var(--mc);display:inline-block;vertical-align:-2px}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts div{background:var(--card);border:1px solid #26232e;border-radius:12px;padding:9px 11px}
.facts span{display:block;font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.facts b{font-size:13.5px;line-height:1.35;display:block;margin-top:2px}
.costline{font-size:13.5px;font-weight:600;padding:6px 0 6px 18px;position:relative;line-height:1.4}
.costline:before{content:"";position:absolute;left:2px;top:12px;width:7px;height:7px;border-radius:50%;background:var(--acc)}
.costline.warn{color:var(--warn)}.costline.warn:before{background:var(--warn)}
.costline.bad{color:var(--bad)}.costline.bad:before{background:var(--bad)}
.fulltext{margin-top:14px;font-size:14.5px;line-height:1.6;color:#d9d3e2}
.fulltext p{margin:0 0 10px}
.gl{color:var(--acc);font-weight:700;text-decoration:underline dotted;text-underline-offset:3px;font-size:inherit}
.glossbox{margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--soft);border:1.5px solid var(--line)}
.wpn.tap{cursor:pointer}
.wpn .more{color:var(--dim);font-weight:700}
.chkrow{padding:12px 14px;border-radius:14px;background:var(--card);border:1px solid #26232e;margin-bottom:8px}
.mini{padding:7px 11px;border-radius:10px;background:var(--card2);border:1px solid #2c2836;font-size:12.5px;font-weight:700}
.mini.on{background:var(--acc);color:var(--ink);border-color:transparent}
/* multiclass: blended class colours */
body.multi .badge{background:var(--mc);text-shadow:0 1px 3px rgba(0,0,0,.45)}
body.multi .startbtn{background:var(--mcsoft);text-shadow:0 1px 3px rgba(0,0,0,.35)}
.clsbar{display:flex;gap:3px;height:6px;width:140px;margin:10px auto 0;border-radius:99px;overflow:hidden}
.clsbar i{display:block;height:100%}
.die{width:64px;height:64px;border-radius:16px;border:2px solid var(--acc);background:var(--soft);color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:center}
.die b{font-size:24px;font-weight:800}.die small{font-size:10px;color:var(--mut)}
.rnote{margin-top:6px;padding:5px 9px;border-left:3px solid var(--acc);background:var(--soft);border-radius:0 8px 8px 0;font-size:12.5px;line-height:1.4;color:var(--txt)}
.rnote b{color:var(--acc);font-weight:800}
.vit{display:flex;flex-direction:column;align-items:inherit}.hero .vit{align-items:center}.hero .vit>.row,.hero .minirow{justify-content:center}
.minirow{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini{font:inherit;font-size:12px;font-weight:700;color:var(--mut);background:transparent;border:1px solid rgba(255,255,255,.12);border-radius:99px;padding:4px 10px;cursor:pointer}
.mini b{color:var(--txt);margin-left:3px}.mini.on{color:var(--acc);border-color:var(--acc)}
.rcat{margin-top:10px;border:1px solid rgba(255,255,255,.08);border-radius:14px;padding:0 12px}
.rcat summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:12px 0;font-weight:800}
.rcat summary::-webkit-details-marker{display:none}.rcat summary::after{content:'›';color:var(--mut);margin-left:8px;transition:transform .2s}.rcat[open] summary::after{transform:rotate(90deg)}
.rcat[open]{padding-bottom:10px}
.dying{border-color:rgba(242,95,92,.45)!important;background:rgba(242,95,92,.07)}
.pips{display:flex;gap:6px;margin-top:6px}.pip{width:18px;height:18px;border-radius:50%;border:2px solid rgba(255,255,255,.25)}.pip.on.ok{background:var(--ok,#4bd18a);border-color:transparent}.pip.on.bad{background:var(--bad);border-color:transparent}
.ab{font-weight:800;color:var(--txt);background:rgba(255,255,255,.09);border-radius:5px;padding:0 4px;font-size:.88em;letter-spacing:.03em}
.dc{font-weight:800;color:var(--acc);white-space:nowrap}
.petstrip{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.petbar{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:11px 14px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--txt)}
.petbar .pn{font-weight:800}
.petbar .php{font-weight:800;color:var(--acc);text-align:right}
.petbar .pw{grid-column:1/-1;font-size:12.5px;color:var(--mut)}
.petbar.down{opacity:.55}
.petbar.down .php{color:var(--bad)}

const masteryOf = n => {
  const k = Object.keys(MASTERY)
    .filter(k => n.toLowerCase().includes(k.toLowerCase()))
    .sort((a, b) => b.length - a.length)[0];
  return k ? MASTERY[k] : null;
};

function bhTemplate(L) {

  if (L >= 18) curses.push('souleater');

    [3, SP('Minor Illusion', 0, 'A', 'Create a sound or small image.')],
    [3, SP('Hex', 1, 'B', '+1d6 necrotic on your hits against the target; disadvantage on one ability.', true)],
    [3, SP('Armor of Agathys', 1, 'A', '5 temporary HP per slot level; melee attackers take that much cold damage.')],
    [5, SP('Hellish Rebuke', 1, 'R', 'When damaged: DEX save, 2d10 fire (+1d10 per slot level above 1).')],

    [15, SP('Hunger of Hadar', 3, 'A', '20-ft sphere of void: blinded inside, 2d6 cold at the start of turns, 2d6 acid at the end (DEX save).', true)],
    [17, SP('Fly', 3, 'A', 'A creature gains a 60-ft fly speed for 10 minutes.', true)],
    [19, SP('Banishment', 4, 'A', 'A creature makes a CHA save or is banished for up to 1 minute.', true)]

function slotSync() {

  const want = FULL[Math.min(casterLevel(ch.classes, ch.edition), 20)] || [];
  for (let i = 1; i <= 9; i++) {
    const n = want[i - 1] || 0,
      sl = ch.slots[i];
    if (n) {
      if (!sl) ch.slots[i] = { max: n, used: 0 };
      else {
        const ex = sl.extra || 0;

  const L = clsLvl('Monk');

  const old = is14('monk'),
    die = old ? (L >= 17 ? 10 : L >= 11 ? 8 : L >= 5 ? 6 : 4) : L >= 17 ? 12 : L >= 11 ? 10 : L >= 5 ? 8 : 6,
    m = ch.mods6 || [0, 0],
    mm = Math.max(m[0], m[1]),
    p = ch.prof || 2;
  ch.weapons.forEach(w => {
    if (!w.mw) return;
    if (w.mw === 'ML' && old) return;
    if (w.mw === 'U') {
      w.dmg = `1d${die}${mm ? (mm > 0 ? '+' : '') + mm : ''}`;

      feats.forEach(df => {
        if (seen.has(df.name)) return;
        seen.add(df.name);
        if (
          !/(Circle|Domain|Oath|Subclass|Bonus|\w+) Spells$/i.test(df.name || '') ||
          /Expanded|Bonus Cantrip/i.test(df.name) ||
          (df.requiredLevel || 1) > lvl
        )
          return;
        let txt = String(df.description || '')
          .replace(/<[^>]+>/g, '|')
          .replace(/&rsquo;|&#39;|[\u2018\u2019]/g, "'")
          .replace(/&nbsp;|&mdash;/g, ' ')
          .replace(/\s+/g, ' ');
        if (!/\d+(st|nd|rd|th)\b/.test(txt)) return;
        const land = (subName.match(/\(([^)]+)\)/) || [])[1] || '';
        const hdr = w => new RegExp('\\|\\s*' + w + '\\s*\\|', 'i');
        if (LANDS.some(l => hdr(l).test(txt))) {
          if (!land) return;
          const lw = land.toLowerCase();
          const m = txt.search(hdr(lw));
          if (m < 0) return;
          let rest = txt.slice(m + lw.length + 2);
          const nxt = LANDS.filter(l => l !== lw)
            .map(l => rest.search(hdr(l)))
            .filter(i => i >= 0);
          if (nxt.length) rest = rest.slice(0, Math.min(...nxt));
          txt = rest;
        }
        const re = /(\d+)(?:st|nd|rd|th)\b([^]*?)(?=\|\s*\d+(?:st|nd|rd|th)\b|$)/g;
        let mm;
        while ((mm = re.exec(txt))) {
          const rl = +mm[1];
          if (rl > lvl || rl > 20) continue;
          const names = mm[2]
            .split(/[|,]/)
            .map(x => x.trim())
            .filter(x => /^[a-z][a-z' \/-]{2,}$/i.test(x) && !/level|spells?$|^and$/i.test(x));
          const spLvl = HALF.includes(cn)
            ? rl <= 4
              ? 1
              : rl <= 8
                ? 2
                : rl <= 12
                  ? 3
                  : rl <= 16
                    ? 4
                    : 5
            : Math.min(9, Math.ceil(rl / 2));
          names.forEach(n0 => {
            const n = n0
              .replace(/(^|[\s\/-])(\w)/g, (m, a, ch) => a + ch.toUpperCase())
              .replace(/ (Of|The|And|With|From|To)\b/g, w => w.toLowerCase());
            if (have.has(n.toLowerCase())) return;
            have.add(n.toLowerCase());
            const k0 = KNOWN_SP[n.toLowerCase()],
              k = k0 && (guessEdition(d) === '2014' || k0.length < 4 ? k0 : [k0[3], k0[4], k0[2]]);
            const cv = (d.characterValues || []).find(
              v =>
                v.typeId === 8 &&
                typeof v.value === 'string' &&
                v.value.toLowerCase().startsWith(n.toLowerCase() + ' [')
            );
            autoSpells.push({
              n: cv ? cv.value : n,
              base: n,
              cls: cn,
              lvl: spLvl,
              t: k ? k[0] : 'A',
              conc: k ? !!k[1] : false,
              auto: df.name,
              unconfirmed: !k,
              d:
                `Always prepared · from ${df.name} (${cn} level ${rl}).` +
                (k
                  ? k[2]
                    ? ' ' + k[2]
                    : ''
                  : ` The app filled this in from your feature's rules text: check its casting time and concentration.`)
            });
          });
        }
      });
    });
    // no table in the export: fall back to the book lists (subclass-spells.js), both rulesets
    (d.classes || []).forEach(c => {
      const cn = c.definition?.name,
        sub = c.subclassDefinition?.name || '';
      if (!sub || autoSpells.some(a => a.cls === cn)) return;
      subSpellList(cn, sub, c.level, guessEdition(d) || '2024').forEach(s0 => {
        const n = s0.n;
        if (have.has(n.toLowerCase())) return;
        have.add(n.toLowerCase());
        const k = KNOWN_SP[n.toLowerCase()],
          meta = SUB_SP_META[n.toLowerCase()];
        const cv = (d.characterValues || []).find(
          v => v.typeId === 8 && typeof v.value === 'string' && v.value.toLowerCase().startsWith(n.toLowerCase() + ' [')
        );
        autoSpells.push({
          n: cv ? cv.value : n,
          base: n,
          cls: cn,
          lvl: s0.lvl,
          t: k ? k[0] : meta ? meta[0] : 'A',
          conc: k ? !!k[1] : meta ? meta.includes('c') : false,
          auto: sub + ' spells',
          unconfirmed: !k && !meta,
          d: `Always prepared · ${sub} spell (${cn} level ${s0.at}).` + (k && k[2] ? ' ' + k[2] : SUB_SP_DESC[n.toLowerCase()] ? ' ' + SUB_SP_DESC[n.toLowerCase()] : '')
        });
      });
    });
    sp.push(...autoSpells);
  }
  const guess = guessEdition(d);
  return {
    source: 'ddb',
    cls,
    name: d.name || 'Adventurer',
    sub: main.sub || '',
    level: L,
    ac,
    speed,
    attacks: ftr && ftr.lvl >= 20 ? 4 : ftr && ftr.lvl >= 11 ? 3 : extra ? 2 : 1,
    edition: guess || '2024',
    rules: {},
    strict: true,
    _guess: guess,
    ddbId: d.id,
    landStride: (d.classes || []).some(c =>
      (c.classFeatures || []).some(
        f => /^Land.s Stride$/i.test(f.definition?.name || '') && (f.definition.requiredLevel || 1) <= c.level
      )
    ),
    classes,
    abil: { STR: score(0), DEX: score(1), CON: score(2), INT: score(3), WIS: score(4), CHA: score(5) },
    resist: [...new Set(mods.filter(m => m.type === 'resistance').map(m => String(m.subType).toLowerCase()))],
    barbLevel: (classes.find(c => c.n === 'Barbarian') || {}).lvl || 0,
    heavy: !!(body && body.definition.armorTypeId === 3),
    bh: bhCfg,
    acImported: ac,
    acParts: parts,
    str: STR,
    prof,
    sc: (() => {
      const sc0 =
        classes.find(
          c =>
            ({
              Bard: 1,
              Sorcerer: 1,
              Warlock: 1,
              Paladin: 1,
              Cleric: 1,
              Druid: 1,
              Ranger: 1,
              Wizard: 1,
              Artificer: 1
            })[c.n] || /Eldritch Knight|Arcane Trickster/.test(c.sub || '')
        ) || main;
      const ab =
        {
          Bard: 'CHA',
          Sorcerer: 'CHA',
          Warlock: 'CHA',
          Paladin: 'CHA',
          Cleric: 'WIS',
          Druid: 'WIS',
          Ranger: 'WIS',
          Wizard: 'INT',
          Artificer: 'INT'
        }[sc0.n] || (/Eldritch Knight|Arcane Trickster/.test(sc0.sub || '') ? 'INT' : null);
      if (!ab) return null;
      const m = { STR, DEX, CON, INT, WIS, CHA }[ab];
      return { dc: 8 + prof + m, atk: prof + m, ab };
    })(),
    druidLevel: (classes.find(c => c.n === 'Druid') || {}).lvl || 0,
    wis: WIS,
    weapons,
    feats: fts,
    spells: sp,
    items: its,
    attn: inv
      .filter(i => i.definition?.canAttune)
      .map(i => ({
        id: i.id,
        n: cvName(i.id) || i.definition.name,
        on: !!i.isAttuned,
        other: (i.definition.grantedModifiers || []).some(
          m => !/armor-class/.test(m.subType || '') && m.type !== 'set'
        )
      })),
    hp: { cur: Math.max(0, maxHp - (d.removedHitPoints || 0)), max: maxHp, temp: d.temporaryHitPoints || 0 },
    slots,
    res,
    multi: classes.length > 1 ? classes.map(c => c.n + ' ' + c.lvl).join(' / ') : '',
    clsKeys: classes.map(c => ({ k: clsKey(c.n), n: c.n, lvl: c.lvl })),
    mods6: M,
    passives,
    pets: parsePets(d),
    circle:
      Object.values(d.actions || {})
        .flat()
        .filter(Boolean)
        .some(a => /Circle Spell/i.test(a.name)) || undefined,
    circleOpts: Object.values(d.actions || {})
      .flat()
      .filter(a => a && /^Circle Spell:/i.test(a.name))
      .map(a => ({ n: a.name.replace(/^Circle Spell:\s*/i, ''), d: short(a.snippet || a.description, 220) })),
    skills,
    initParts,
    hd,
    conMod: CON,
    saves,
    insp: !!d.inspiration,
    resourceful: (d.race?.racialTraits || []).some(t => t.definition?.name === 'Resourceful') || undefined,
    adept: adept.length ? adept : undefined,
    smiteProt: hasFeat('Smite of Protection') || undefined
  };
}

/* ---------- D&D Beyond import: class-by-class tidying ----------
 * parseDDB reads the export into plain features (fts) and limited-use pools (res).
 * Each function here reshapes one class's features into the cards the app shows.
 * X = {d (raw export), fts, res, classes, weapons, prof, INT, WIS}; fts and res change in place. */

// Lay on Hands: one card (the pool); the sub-actions are choices inside its screen
function importLayOnHands(X) {
  const { d, fts, res, classes, weapons, prof, INT, WIS } = X;
  const pool = fts.find(f => /^Lay on Hands/i.test(f.n) && f.res);
  if (pool) {
    pool.n = 'Lay on Hands';
    if (res[pool.res]) res[pool.res].n = 'Lay on Hands pool';
    pool.restoring = fts.some(f => /Restoring Touch/i.test(f.n));
    for (let i = fts.length - 1; i >= 0; i--)
      if (fts[i] !== pool && /^Lay on Hands/i.test(fts[i].n)) fts.splice(i, 1);
  }
  // passive features: shown where they apply instead of as buttons
  for (let i = fts.length - 1; i >= 0; i--)
    if (/^(Radiant Strikes|Improved Divine Smite|Smite of Protection)$/i.test(fts[i].n)) fts.splice(i, 1);
}

// "Channel Divinity: Vow of Enmity" etc. spend the shared Channel Divinity pool
function importChannelDivinity(X) {
  const { d, fts, res, classes, weapons, prof, INT, WIS } = X;
  fts.forEach(f => {
    const m = f.n.match(/^([^:]+):\s*(.+)$/);
    if (!m || f.res) return;
    const pool = fts.find(x => x !== f && x.res && x.n.toLowerCase() === m[1].trim().toLowerCase());
    if (pool) f.res = pool.res;
  });
  {
    const cd = fts.find(x => /^Channel Divinity$/i.test(x.n) && x.res);
    fts.forEach(f => {
      if (/^Harness Divine Power$/i.test(f.n)) f.effect = 'regainSlot';
      if (/Sacred Weapon/i.test(f.n) && !f.res && cd) f.res = cd.res;
    });
    const tu = fts.find(x => /Turn Undead$/i.test(x.n)),
      cl = (classes.find(c => c.n === 'Cleric') || {}).lvl || 0;
    if (tu && cl >= 5 && guessEdition(d) !== '2024') {
      const cr = cl >= 17 ? '4' : cl >= 14 ? '3' : cl >= 11 ? '2' : cl >= 8 ? '1' : '½';
      tu.notes = [...(tu.notes || []), `Destroy Undead: CR ${cr} or lower that fail are destroyed`];
    }
    if (cd) {
      fts.forEach(f => {
        if (
          f !== cd &&
          !/^Channel Divinity/i.test(f.n) &&
          !/Sacred Weapon/i.test(f.n) &&
          /expend (a|one) use of (your |this class's )?Channel Divinity/i.test(f.full || f.d || '')
        ) {
          if (f.res) f.res2 = cd.res;
          else f.res = cd.res;
        }
      });
      if (fts.some(x => /^Channel Divinity:/i.test(x.n))) fts.splice(fts.indexOf(cd), 1);
    }
  } // the options carry the pool; the bare feature has nothing to do
}

// Sorcery Points: link Metamagic and Font of Magic to the shared pool
function importSorcery(X) {
  const { d, fts, res, classes, weapons, prof, INT, WIS } = X;
  const spf = fts.find(f => /Sorcery Points/i.test(f.n) && f.res);
  const SPK = spf && spf.res;
  const SLOTCOST = { 1: 2, 2: 3, 3: 5, 4: 6, 5: 7 };
  fts.forEach(f => {
    if (/^Metamagic:/i.test(f.n) && SPK) {
      const m = (f.full || f.d || '').match(/spend (\d+) Sorcery Points?/i);
      Object.assign(f, { res: SPK, step: m ? +m[1] : 1 });
      if (/Quickened/i.test(f.n)) f.effect = 'quicken';
    }
    const cs = f.n.match(/Create Spell Slot Level (\d)/i);
    if (cs && SPK)
      Object.assign(f, { res: SPK, step: SLOTCOST[cs[1]] || 2, kind: 'createSlot', slotLvl: +cs[1] });
    if (/^Font of Magic: Convert/i.test(f.n)) Object.assign(f, { t: 'F', kind: 'convertSlot', spk: SPK });
    if (/^Innate Sorcery$/i.test(f.n)) Object.assign(f, { status: 'Innate Sorcery', kind: 'innate' });
  });
}

// Druid: Natural Recovery belongs to the short rest; Wild Companion spends Wild Shape
function importDruid(X) {
  const { d, fts, res, classes, weapons, prof, INT, WIS } = X;
  fts.forEach(f => {
    if (/^Natural Recovery$/i.test(f.n)) {
      f.natRec = true;
      if (/cast/i.test((f.full || '') + ' ' + (f.d || ''))) {
        f.t = 'F';
        f.d =
          'Cast one of your Circle spells without a spell slot, once per long rest. Getting spent slots back happens on a short rest: see Short Rest.';
      } else f.restOnly = true;
    }
    if (/^Wild Companion/i.test(f.n)) {
      const ws = fts.find(x => x.effect === 'wildshape' && x.res);
      if (ws)
        Object.assign(f, {
          res: ws.res,
          d: 'Spend a use of Wild Shape to cast Find Familiar without material components. ' + f.d
        });
    }
  });
}

// Monk: Focus features spend Focus, riders and upgrades fold into their cards, Martial Arts gets its bonus strike
function importMonk(X) {
  const { d, fts, res, classes, weapons, prof, INT, WIS } = X;
  const mk = classes.find(c => c.n === 'Monk');
  if (mk) {
    const old = guessEdition(d) === '2014',
      pool =
        fts.find(f => /^(Focus|Ki)( Points)?$/i.test(f.n) && f.res) ||
        fts.find(f => /^(Monk's Focus|Ki)$/i.test(f.n) && f.res),
      FK = pool && pool.res,
      FN = pool && /Ki/i.test(pool.n) ? 'ki' : 'Focus';
    const has = re => fts.some(f => re.test(f.n)),
      drop = new Set(),
      add = [];
    const riders = fts
      .filter(f => /^Flurry of Blows: (Addle|Push|Topple)/i.test(f.n))
      .map(r => {
        const k = r.n.split(': ')[1],
          dc = (((r.d || '') + ' ' + (r.full || '')).match(/DC (\d+)/) || [])[1] || 8 + prof + WIS;
        return k === 'Addle'
          ? "Addle: it can't make Opportunity Attacks until the start of its next turn"
          : k === 'Push'
            ? `Push: STR save DC ${dc} or pushed 15 ft away`
            : `Topple: DEX save DC ${dc} or Prone`;
      });
    fts.forEach(f => {
      if (pool && f === pool) {
        drop.add(f);
        return;
      }
      if (
        /\(Heightened\)$/i.test(f.n) ||
        /^Flurry of Blows: (Addle|Push|Topple)/i.test(f.n) ||
        /^Deflect Energy$/i.test(f.n)
      ) {
        drop.add(f);
        return;
      }
      if (/^Flurry of Blows$/i.test(f.n)) {
        Object.assign(f, {
          t: 'B',
          res: FK,
          kind: 'flurry',
          d: `${has(/^Flurry of Blows \(Heightened\)/i) ? 'Three' : 'Two'} Unarmed Strikes for 1 ${FN}.`,
          notes: riders.length ? ['On a hit, pick one: ' + riders.join(' · ')] : f.notes
        });
      }
      if (/^Patient Defense$/i.test(f.n)) {
        if (old) Object.assign(f, { res: FK, status: 'Dodging', d: `1 ${FN}: take the Dodge action.` });
        else {
          Object.assign(f, { status: 'Disengaged', d: 'Take the Disengage action.' });
          add.push(
            F(
              'Patient Defense + Focus',
              'B',
              `1 Focus: Disengage and Dodge${has(/^Patient Defense \(Heightened\)/i) ? ', and gain 2d10 temporary HP' : ''}.`,
              { res: FK, status: 'Dodging', status2: 'Disengaged' }
            )
          );
        }
      }
      if (/^Step of the Wind$/i.test(f.n)) {
        if (old)
          Object.assign(f, {
            res: FK,
            effect: 'dash',
            d: `1 ${FN}: Dash or Disengage; your jump distance doubles.`
          });
        else {
          Object.assign(f, { effect: 'dash', d: 'Take the Dash action.' });
          add.push(
            F(
              'Step of the Wind + Focus',
              'B',
              `1 Focus: Disengage and Dash; your jump distance doubles${has(/^Step of the Wind \(Heightened\)/i) ? '. You can bring a willing Large-or-smaller creature within 5 ft along' : ''}.`,
              { res: FK, effect: 'dash', status: 'Disengaged' }
            )
          );
        }
      }
      if (/^Stunning Strike$/i.test(f.n)) Object.assign(f, { t: 'F', res: FK, once: 'stun' });
      if (/^Deflect Attacks?: Redirect/i.test(f.n))
        Object.assign(f, {
          t: 'F',
          res: FK,
          d: 'After Deflect Attacks cuts the damage to 0: 1 Focus to send it back. ' + (f.d || '')
        });
      if (/^Deflect Attacks?$/i.test(f.n) && has(/^Deflect Energy$/i))
        f.d = (f.d || '') + ' Deflect Energy: works against any damage type.';
      if (/^Step of the Wind: Fleet Step$/i.test(f.n))
        Object.assign(f, {
          t: 'F',
          d: 'Right after another Bonus Action (not Step of the Wind): use Step of the Wind too.'
        });
    });
    for (let i = fts.length - 1; i >= 0; i--) if (drop.has(fts[i])) fts.splice(i, 1);
    fts.push(...add);
    if (!has(/^Martial Arts/i)) fts.unshift(F('Martial Arts: Unarmed Strike', 'B', '', { kind: 'maStrike' }));
    weapons.forEach(w => {
      const b = String(w.base || w.n)
          .replace(/,?\s*\+\d+$/, '')
          .trim(),
        r = typeof WPN !== 'undefined' && WPN.find(x => x[0].toLowerCase() === b.toLowerCase());
      if (w.unarmed) w.mw = 'U';
      else if (
        r &&
        !w.ranged &&
        !/(^| )(H|2)( |$)/.test(r[4]) &&
        !/^R\d/.test(r[4].split(' ').find(x => /^R\d/.test(x)) || '')
      ) {
        w.mw = r[3] === 'S' ? 'S' : /(^| )L( |$)/.test(r[4]) ? (b === 'Shortsword' ? 'SS' : 'ML') : null;
      }
      if (w.mw) w.dmgBase = w.dmg;
    });
  }
}

// Blood Hunter: read curses, rites and patron from the character's chosen options
function importBloodHunter(X) {
  const { d, fts, res, classes, weapons, prof, INT, WIS } = X;
  const bhc = classes.find(c => c.n === 'Blood Hunter');
  if (!bhc) return null;
  const names = [
    ...Object.values(d.options || {})
      .flat()
      .filter(Boolean)
      .map(o => o.definition?.name || ''),
    ...Object.values(d.actions || {})
      .flat()
      .filter(Boolean)
      .map(a => a.name || ''),
    ...(d.classes || []).flatMap(c =>
      (c.classFeatures || [])
        .filter(f => (f.definition?.requiredLevel || 1) <= (c.level || 1))
        .map(f => f.definition?.name || '')
    )
  ].filter(Boolean);
  const has = re => names.some(n => re.test(n));
  const CW = {
    anxious: 'Anxious',
    binding: 'Binding',
    bloated: 'Bloated Agony',
    exposure: 'Exposure',
    eyeless: 'Eyeless',
    puppet: 'Fallen Puppet',
    marked: 'Marked',
    muddled: 'Muddled Mind',
    corrosion: 'Corrosion',
    exorcist: 'Exorcist',
    howl: 'Howl',
    souleater: 'Soul ?eater'
  };
  const curses = Object.keys(CW).filter(k => has(new RegExp('Blood Curse of (the )?' + CW[k], 'i')));
  const rites = Object.keys(RITES).filter(k => has(new RegExp('Rite of (the )?' + k, 'i')));
  const PW = {
    archfey: 'Archfey',
    celestial: 'Celestial',
    fathomless: 'Fathomless',
    fiend: 'Fiend',
    genie: 'Genie',
    goo: 'Great Old One',
    hexblade: 'Hexblade',
    undying: 'Undying',
    undead: '^(The )?Undead$'
  };
  const patron =
    Object.keys(PW).find(k =>
      has(new RegExp('^(The )?(' + PW[k].replace(/^\^\(The \)\?|\$$/g, '') + ')$', 'i'))
    ) || null;
  const wlc = classes.find(c => c.n === 'Warlock');
  const hemoOpt = names.find(n => /^Hemocraft Modifier:/i.test(n));
  const bhCfg = {
    level: bhc.lvl,
    order: bhc.sub || '',
    patron,
    hemo: hemoOpt ? (/Wisdom/i.test(hemoOpt) ? 'WIS' : 'INT') : WIS > INT ? 'WIS' : 'INT',
    int: INT,
    wis: WIS,
    curses,
    rites,
    tempSoak: true,
    wl: wlc ? wlc.lvl : 0
  };
  const DROP =
    /^(Blood Curse|Crimson Rite|Rite of the|Blood Maledict|Brand of Castigation|Rite Focus|Mystic Frenzy|Revealed Arcana|Unsealed Arcana)/i;
  bhCfg.texts = {};
  for (let i = fts.length - 1; i >= 0; i--)
    if (DROP.test(fts[i].n)) {
      if (fts[i].full) bhCfg.texts[fts[i].n.toLowerCase()] = fts[i].full;
      if (fts[i].res) delete res[fts[i].res];
      fts.splice(i, 1);
    }
  return bhCfg;
}

/* ---------- actions ---------- */
function startTurn() {
  const c = C(),
    first = c.phase === 'idle' || (c.phase === 'off' && c.round === 0);
  c.round = c.phase === 'idle' ? 1 : c.round + 1;
  if (c.held.length) {
    toast(`Your held action${c.held.length > 1 ? 's' : ''} expired`);
    c.held = [];
    if (S.conc && S.conc.startsWith('Held:')) S.conc = null;
  }
  Object.assign(c, {
    phase: 'turn',
    action: true,
    bonus: true,
    reaction: true,
    interact: true,
    moveUsed: 0,
    dash: 0,
    moves: [],
    attacksLeft: 0,
    atkMax: 0,
    spellSlotThisTurn: false,
    cast: [],
    flags: {},
    noMove: false,
    spent: {},
    surprisedTurn: false
  });
  c.flags.hasteAct = !!S.cond.hasted;
  if (c.innateFrom && c.round - c.innateFrom >= 10) {
    c.innateFrom = 0;
    c.status = c.status.filter(s => s !== 'Innate Sorcery');
    toast('Innate Sorcery ends — 1 minute is up');
  }
  if (c.circleOn) {
    toast(
      `Circle spell <b>${esc(c.circleOn.n)}</b>: if any secondary caster didn't contribute in time, the spell fails`
    );
    c.circleOn = null;
  }

      toast(`No ${resName(o.res2)} left`);
      return;
    }
    const why = featReason(o);
    if (why && (ch.strict || o.effect === 'surge')) {
      toast(esc(why));
      return;
    }
    if (CH().bh) {
      const why2 = bhReason(o);
      if (why2) {
        toast(esc(why2));
        return;
      }
      if (o.kind === 'rite') {
        if (!costFree('B')) {
          spend('B');
          return;
        }
        PB = { kind: 'rite', rite: bh().rites.length === 1 ? bh().rites[0] : null };
        openSheet('Crimson Rite', bloodSheet);
        return;
      }
    }
    if (o.effect === 'wildshape') {
      if (!costFree(o.t)) {
        spend(o.t);
        return;
      }
      WSF = { show: 'ok', mv: 'any' };
      openSheet('Wild Shape', wsSheet);
      return;
    }
    if (o.t !== 'F' && o.t !== 'O' && !spend(o.t, o.n)) return;
    spendRes(o.res, o.step || 1);
    if (o.res2) spendRes(o.res2);
    if (/Vow of Enmity/i.test(o.n)) {
      C().status = C().status.filter(x => !/^Vow of Enmity/.test(x));
      addStatus(`Vow of Enmity: advantage vs your target until round ${C().round + 10}`);
    }
    if (o._i !== undefined && o.consume) {
      ch.items[o._i].q--;
    }
    doEffect(o);
    if (o.curse && bh() && bh().patron === 'hexblade' && isProfane())
      addStatus(`Hexblade: +${CH().prof || 3} on your next hit vs the cursed target`);
    if (!o.effect)
      toast(
        o.atk
          ? `<b>${esc(o.n)}</b>: +${o.atk.hit} to hit · ${esc(o.atk.dmg)} ${esc(o.atk.type)}`
          : `Used <b>${esc(o.n)}</b>${why ? `<br><span style="color:var(--warn)">House rule: ${esc(why)}</span>` : ''}`
      );
    render();
  },
  acShield() {
    const ch = CH(),
      p = (ch.acParts || []).find(x => x.shield);
    if (!p) return;
    p.down = !p.down;
    p.off = p.down || undefined;
    const d = p.down ? -p.v : p.v;
    ch.ac += d;
    if (ch.acImported != null) ch.acImported += d;
    save();
    render();
    toast(p.down ? `Shield down: AC ${ch.ac}` : `Shield up: AC ${ch.ac}`);
  },
  castAt(arg) {
    const [id, k] = arg.split('|');
    const s = spells().find(x => x._id === id);
    if (s) {
      castSpell(s, k);
      render();
    }
  },
  slot(arg) {
    const [k, i] = arg.split('|');
    const x = CH().slots[k];
    const avail = x.max - x.used;
    x.used = +i < avail ? x.max - +i : x.max - +i - 1;
    x.used = Math.max(0, Math.min(x.max, x.used));
    render();
  },
  mv(v) {
    v = +v;
    const c = C();
    if (c.surprisedTurn && v > 0) {
      toast("Surprised — you can't move this turn");
      return;
    }
    if (c.noMove && v > 0) {
      toast('Steady Aim: no movement this turn');
      return;
    }
    if (v < 0) {
      if (!c.moveUsed) return;
      c.moveUsed = Math.max(0, c.moveUsed + v);
      c.moves.push({ cost: v });
      render();
      return;
    }
    const cost = c.flags.difficult ? v * 2 : v;
    if (cost > moveLeft()) {
      toast(
        moveLeft()
          ? `Only ${moveLeft()} ft left${c.action ? ' — Dash for more' : ''}`
          : speedNote() || 'No movement left'
      );

    }
    c.moveUsed += cost;
    c.moves.push({ cost, note: c.flags.difficult ? 'difficult' : '' });

  },
  mvUndo() {
    const c = C();
    const m = c.moves.pop();
    if (m) c.moveUsed = Math.max(0, c.moveUsed - m.cost);

  },
  mvReset() {

  fireHeld(i) {

  },
  dropHeld(i) {

  },
  hpDo(k) {
    let v = parseInt($('#hpAmt').value, 10);
    if (!v || v < 0) {
      toast('Enter an amount');
      return;
    }
    const hp = CH().hp;
    if (k === 'dmg' && S.ws && is14('ws')) {
      S.ws.hp -= v;
      let dc = Math.max(10, Math.floor(v / 2));
      if (S.ws.hp <= 0) {
        const over = -S.ws.hp,
          n = S.ws.n;
        S.ws = null;
        let r = over;
        const t = Math.min(hp.temp, r);
        hp.temp -= t;
        r -= t;
        hp.cur = Math.max(0, hp.cur - r);
        toast(
          `Your ${esc(n)} form drops to 0 HP — you change back${over ? ` and take <b>${over}</b> leftover damage` : ''}`
        );
      } else if (S.conc) toast(`Concentration check: <b>CON save DC ${dc}</b>`);
      render();
      return;
    }
    if (k === 'heal' && S.ws && is14('ws')) {
      S.ws.hp = Math.min(S.ws.max, S.ws.hp + v);
      render();
      return;
    }
    if (k === 'half') {
      v = Math.floor(v / 2);
      k = 'dmg';
    }
    let petMsg = '';
    if (k === 'dmg' && S.cond.petrified) {
      const o = v;
      v = Math.floor(v / 2);
      petMsg = `Petrified: ${o} halved to ${v}<br>`;
    }
    if (k === 'dmg' && S.rage) S.rage.keep = true;
    let wardMsg = '';
    if (k === 'dmg' && CH().ward && CH().ward.cur > 0) {
      const w = CH().ward,
        a = Math.min(w.cur, v);
      w.cur -= a;
      v -= a;
      wardMsg = `Arcane Ward absorbs ${a} (${w.cur}/${w.max} left)`;
      if (!v) {
        toast(wardMsg + '<br><span class="mut">You take no damage, so no concentration check</span>');
        render();
        return;
      }
    }
    if (k === 'dmg' && hp.cur === 0 && S.dying && !S.dying.dead) {
      if (v >= hp.max) {
        S.dying = { dead: true, why: 'Massive damage: a single hit at least your HP maximum.' };

      } else {
        S.dying.stable = false;
        S.dying.f += 1;
        toast(
          'Damage while at 0 HP: <b>one death save failure</b><br><span class="mut">A critical hit counts as two: tap "Critical hit" on the death save panel</span>'
        );
        dsResolve();
      }
      closeSheet();
      render();
      return;
    }
    const hpBefore = hp.cur;
    let lostConc = null,
      relent = null;
    if (k === 'dmg') {
      let r = v;
      const t = Math.min(hp.temp, r);
      hp.temp -= t;
      r -= t;
      hp.cur = Math.max(0, hp.cur - r);
      if (hp.cur === 0 && hpBefore > 0 && r - hpBefore < hp.max) {
        const rf = CH().feats.find(
          f => f.kind === 'relentless' && CH().res[f.res] && CH().res[f.res].cur > 0
        );
        if (rf) {
          CH().res[rf.res].cur--;
          hp.cur = 1;
          relent = rf.n;
        }
      }
      if (hp.cur === 0 && S.blade) {
        S.blade = false;
      }
      if (hp.cur === 0) {
        const over = r - hpBefore;
        if (over >= hp.max)
          S.dying = {
            dead: true,
            why: `Massive damage: ${over} damage left over after dropping to 0, at least your HP maximum (${hp.max}).`
          };
        else S.dying = { s: 0, f: 0 };
        if (S.conc) {
          lostConc = S.conc;
          S.conc = null;
        }
      }
      if (S.rage && hp.cur === 0) {
        if (hasP('Relentless Rage')) {
          S.rr = (S.rr || 0) + 1;
          toast(
            `You drop to 0 HP<br><b>Relentless Rage</b>: make a CON save, DC ${5 + 5 * S.rr}. Success: you stay up${is14('rage') ? ' with 1 HP' : ` with ${2 * clsLvl('Barbarian')} HP`} (use Heal), and keep raging.`
          );
          render();
          return;
        }
        S.rage = null;
        toast('You drop to 0 HP — your Rage ends');
        render();
        return;
      }
      if (S.ws && hp.cur === 0) {
        const n = S.ws.n;
        S.ws = null;
        toast(`You drop to 0 HP — your ${esc(n)} form ends`);
        render();
        return;
      }
      let dc = Math.max(10, Math.floor(v / 2));
      if (!is14('conc')) dc = Math.min(30, dc);
      const fc =
        wizSub(/Conjur/i) &&
        wizLvl() >= (is14('evoker') ? 10 : 10) &&
        /Conjuration/i.test(spSchool(spells().find(x => x.n === S.conc) || {}));
      if (S.conc && fc)
        toast(
          `${wardMsg ? wardMsg + '<br>' : ''}Focused Conjuration: taking damage can't break your concentration on <b>${esc(S.conc)}</b>`
        );
      else if (S.conc)
        toast(
          `${wardMsg ? wardMsg + '<br>' : ''}Concentration check: <b>CON save DC ${dc}</b>${S.cond.blessed ? ' (+1d4 Blessed)' : ''}${saveHints()}${CH().saves ? `<br>Your CON save: ${CH().saves[2] + (S.blade ? intMod() : 0) >= 0 ? '+' : ''}${CH().saves[2] + (S.blade ? intMod() : 0)}${S.blade ? ' (incl. Bladesong)' : ''}` : S.blade ? `<br>Bladesong: +${intMod()} to this save` : ''}`
        );
      else if (hp.cur === 0)
        toast(
          S.dying && S.dying.dead
            ? 'Massive damage: you die instantly'
            : `You drop to 0 HP: <b>Unconscious</b>, death saves begin${lostConc ? `<br>Your concentration on ${esc(lostConc)} ends` : ''}`
        );
      else toast(`${petMsg}${wardMsg ? wardMsg + '<br>' : ''}You take ${v} damage · HP ${hp.cur}/${hp.max}`);
    }
    if (k === 'dmg' && relent)
      toast(
        `<b>${esc(relent)}</b>: you drop to 1 HP instead of 0${S.conc ? `<br>Concentration check: <b>CON save DC ${Math.max(10, Math.floor(v / 2))}</b>` : ''}`
      );
    if (k === 'heal') {
      hp.cur = Math.min(hp.max, hp.cur + v);
      if (S.dying && hp.cur > 0) {
        S.dying = null;
        toast(`Healed: HP ${hp.cur}/${hp.max} · you're conscious again`);
      }
    }
    if (k === 'temp') hp.temp = Math.max(hp.temp, v);
    render();
  },
  resAdj(arg) {
    const [k, d] = arg.split('|');
    const r = CH().res[k];
    r.cur = Math.max(0, Math.min(r.max, r.cur + +d));
    render();
  },
  rest(type) {
    const ch = CH();
    if (type === 'long' && S.fam && S.fam.fey) {
      S.fam = null;
      if (S.pets) delete S.pets.fam;
    }
    if (type === 'long' && S.pets) Object.keys(S.pets).forEach(k => (S.pets[k].cur = (pets().find(p => p.id === k) || { max: S.pets[k].cur }).max));
    S.rite = null;
    S.rage = null;
    S.rr = 0;
    const rk = (rageFeat() || {}).res;
    Object.values(ch.res).forEach(r => {
      if (type === 'short' && r.k === rk && !is14('rage')) {
        r.cur = Math.min(r.max, r.cur + 1);
        return;
      }
      if (type === 'short' && /^Channel Divinity$/i.test(r.n) && !is14('cd')) {
        r.cur = Math.min(r.max, r.cur + 1);
        return;
      }
      if (type === 'long' || r.rest === 'short') r.cur = r.max;
    });
    Object.entries(ch.slots).forEach(([k, s]) => {
      if (type === 'long' || s.rest === 'short') s.used = 0;
      if (type === 'long' && s.extra) {
        s.max -= s.extra;
        s.extra = 0;
      }
    });
    if (type === 'long') {
      ch.hp.cur = ch.hp.max;
      ch.hp.temp = 0;
      S.conc = null;
      S.ws = null;
      S.blade = false;
      S.dying = null;
      S.rep = [];
      if (S.shil) endShil();
      ch.ward = null;
      ch.wardMade = false;
      if (ch.resourceful) ch.insp = true;
      if (isDiv()) ch.portent = [];
      if (S.cond.exhaust) S.cond.exhaust--;
    }
    if (type === 'short') closeSheet();
    toast(
      type === 'long'
        ? 'Long rest: restored (and 1 exhaustion level removed)'
        : 'Short rest: short-rest features restored'
    );
    render();
  },
  async import(arg) {
    let raw =
      typeof arg === 'string' && arg.trim().startsWith('{')
        ? arg.trim()
        : (($('#ddbJson') || {}).value || '').trim();
    const f = $('#ddbFile') && $('#ddbFile').files[0];
    if (!raw && f) raw = await f.text();
    if (!raw) {
      toast('Paste your character data first');
      return;
    }
    try {
      const ch = parseDDB(raw);
      pendingGuess = ch._guess;
      delete ch._guess;
      const old = S.char;
      let kept = [],
        synced = null;
      if (old && old.ddbId && old.ddbId === ch.ddbId) {
        // same character re-imported: keep what the player set up in the app
        const add = (old.spells || []).filter(
          x => x.added && !ch.spells.some(y => y.n.toLowerCase() === x.n.toLowerCase())
        );
        ch.spells.push(...add);
        if (add.length) kept.push(`${add.length} added spell${add.length > 1 ? 's' : ''}`);
        let n = 0;
        (old.items || [])
          .filter(x => x.custom && x.t)
          .forEach(x => {
            const y = ch.items.find(y => y.custom && y.n === x.n && !y.t);
            if (y) {
              y.t = x.t;
              y.consume = x.consume;
              n++;
            }
          });
        if (n) kept.push(`${n} item cost${n > 1 ? 's' : ''}`);
        (old.spells || [])
          .filter(x => x.auto && !x.unconfirmed)
          .forEach(x => {
            const y = ch.spells.find(y => y.auto && y.n === x.n);
            if (y) {
              y.t = x.t;
              y.conc = x.conc;
              y.unconfirmed = false;
              y.d = x.d;
            }
          });
        // the sheet is the source of truth: attunement, HP, slots and uses follow it. Say what changed.
        const diff = [];
        (old.attn || []).forEach(a => {
          const b = (ch.attn || []).find(b => b.id === a.id);
          if (b && b.on !== a.on) diff.push(`${b.n}: ${b.on ? 'attuned' : 'not attuned'}`);
        });
        if (!!old.insp !== !!ch.insp)
          diff.push(ch.insp ? 'Heroic Inspiration: yes' : 'Heroic Inspiration: no');
        if (old.hp && ch.hp && (old.hp.cur !== ch.hp.cur || old.hp.temp !== ch.hp.temp))
          diff.push(`HP ${ch.hp.cur}/${ch.hp.max}`);
        const su = o =>
          Object.entries(o.slots || {})
            .map(([k, v]) => k + ':' + v.used)
            .join(',');
        if (su(old) !== su(ch)) diff.push('spell slots');
        const ru = o =>
          Object.values(o.res || {})
            .map(r => r.n + ':' + r.cur)
            .sort()
            .join(',');
        if (ru(old) !== ru(ch)) diff.push('uses of features');
        if (diff.length) synced = diff;
        (old.removedAuto || []).forEach(n => {
          const i = ch.spells.findIndex(y => y.auto && y.n === n);
          if (i >= 0) ch.spells.splice(i, 1);
        });
        ch.removedAuto = old.removedAuto || [];
        Object.assign(ch, {
          edition: old.edition,
          editionSet: true,
          rules: old.rules || {},
          strict: old.strict,
          strictTouched: old.strictTouched
        });
        if (old.bh && ch.bh) {
          ch.bh.hemo = old.bh.hemo;
          ch.bh.tempSoak = old.bh.tempSoak;
        }
        pendingGuess = null;
      }
      const same0 = old && old.ddbId && old.ddbId === ch.ddbId;
      ch.importedAt = Date.now();
      if (!same0) shelfKeep(ch);
      S = same0 ? { ...S, char: ch } : { char: ch, conc: null, cond: freshCond(), c: newCombat(), ws: null };
      if (S.shil) applyShil();
      /* same character: keep the fight going */ if (pendingGuess) ch.editionSet = true;
      render();
      const same = old && old.ddbId === ch.ddbId;
      if (checkNeeds().any) openSheet('Quick check', importCheckSheet);
      else closeSheet();
      toast(
        `${kept.length || (old && old.ddbId === ch.ddbId) ? 'Updated' : 'Linked'} <b>${esc(ch.name)}</b>${ch.multi ? ' (' + esc(ch.multi) + ')' : ''}${synced ? `<br><span class="mut">From your sheet: ${esc(synced.join(' · '))}</span>` : ''}${kept.length ? `<br>Kept your ${kept.join(' and ')}` : ''}${sheetNotes().length ? `<br><span style="color:var(--warn)">${sheetNotes().length} rules note${sheetNotes().length > 1 ? 's' : ''}: see the menu</span>` : ''}${shelfToast()}`
      );
    } catch (e) {
      toast("Couldn't read that: " + esc(e.message.slice(0, 80)));
    }
  }
};
document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act,
    f = ACT[a];
  if (!f) return;
  e.preventDefault();
  const before = UNDOABLE.has(a) ? JSON.stringify(S) : null;
  await f(el.dataset.arg, el);
  const fromDetails = (sheetFn === detailsSheet || sheetFn === weaponSheet) && before;
  if (before && JSON.stringify(S) !== before) {
    const b = JSON.parse(before).c,
      a = S.c;
    let what = 'other',
      label = '';
    if (b.action && !a.action) {
      what = 'action';
      label = a.spent.action;
    } else if (a.flags.offhand && !b.flags.offhand) {
      what = b.bonus && !a.bonus ? 'bonus' : 'attack';
      label = `extra attack (${a.lastAtk})`;
    } else if (a.attacksLeft < b.attacksLeft) {
      what = 'attack';
      label = a.lastAtk ? a.lastAtk + ' attack' : 'that attack';
    } else if (b.bonus && !a.bonus) {
      what = 'bonus';
      label = a.spent.bonus;
    } else if (b.reaction && !a.reaction) {
      what = 'reaction';
      label = a.spent.reaction;
    }
    hist.push({ s: before, what, label });
    if (hist.length > 30) hist.shift();
    if (fromDetails && (sheetFn === detailsSheet || sheetFn === weaponSheet)) backSheet();
    else render();
  }
});

  const D = hbDer(B),
    f = D.lv('Fighter');

  ['Barbarian', 'Monk', 'Paladin', 'Ranger'].forEach(n => {
    if (D.lv(n) >= 5) a = Math.max(a, 2);
  });
  if (D.lv('Bard') >= 6 && /Valor|Swords/i.test(D.sub('Bard'))) a = Math.max(a, 2);
  if (D.lv('Wizard') >= 6 && /Blades/i.test(D.sub('Wizard'))) a = Math.max(a, 2);
  if (D.lv('Artificer') >= 5 && /Battle Smith|Armorer/i.test(D.sub('Artificer'))) a = Math.max(a, 2);

}

function hbSpcResist(B) {

    if (k >= 18) pas('wiz.mastery', 'Spell Mastery', 'Your chosen level 1 and level 2 spells can be cast at their lowest level without a slot.');
    if (k >= 20) {
      res('sig', 'Signature Spells', 2, 'short');
      add('wiz.sig', 'Signature Spells', 'A', 'Cast one of your two level 3 signature spells without a slot. Each once per short rest.', { res: 'sig' });
    }
  }

  if ((k = lv('Artificer'))) {
    if (k >= 11) {
      res('ssi', 'Spell-Storing Item', mx(2 * m.INT), 'long');
      add('art.ssi', 'Spell-Storing Item', 'A', 'Whoever holds the item casts the level 1–3 spell stored in it.', { res: 'ssi' });
    }
    if (k >= 20)
      add('art.soul', 'Soul of Artifice', 'F', 'When you drop to 0 HP: end one of your infusions to drop to 1 HP instead.');
  }
}

  [/loxodon/i, 'Natural Armor (Loxodon)', 12, 'CON', 0],

function hbAC(B) {
  const D = hbDer(B),

    sp = SPC_AC.find(x => x[0].test(B.species || '')),
    ABL = { DEX: 'Dexterity', CON: 'Constitution', WIS: 'Wisdom', CHA: 'Charisma' };

  if (+B.ac && B.arm == null && !B.shield && !(B.acx || []).length && !+B.acb)
    return { ac: +B.ac, calc: +B.ac, parts: [{ n: 'From your sheet', v: +B.ac, base: true, todo: true }] };
  if (a[1]) {
    const dex = a[2] === 'H' ? 0 : a[2] === 'M' ? Math.min(2, m.DEX) : m.DEX;
    parts.push({ n: a[0] + (a[2] === 'H' ? ' (heavy armour)' : a[2] === 'M' ? ' (medium armour)' : /spell/.test(a[0]) ? '' : ' (light armour)'), v: a[1], base: true });
    if (a[2] === 'M') parts.push({ n: `Dexterity${m.DEX > 2 ? ' (max +2 in medium armour)' : ''}`, v: dex });
    else if (a[2] === 'L') parts.push({ n: 'Dexterity', v: dex });
  } else {
    const opts = [[{ n: 'No armour', v: 10, base: true }, { n: 'Dexterity', v: m.DEX }]];
    if (D.lv('Barbarian')) opts.push([{ n: 'Unarmored Defense (Barbarian)', v: 10, base: true }, { n: 'Dexterity', v: m.DEX }, { n: 'Constitution', v: m.CON }]);
    if (D.lv('Monk') && !B.shield) opts.push([{ n: 'Unarmored Defense (Monk)', v: 10, base: true }, { n: 'Dexterity', v: m.DEX }, { n: 'Wisdom', v: m.WIS }]);
    if (B.cls.some(c => c.n === 'Sorcerer' && /dragon|draconic/i.test(c.sub || '')))
      opts.push(
        B.ed === '2014'
          ? [{ n: 'Draconic Resilience', v: 13, base: true }, { n: 'Dexterity', v: m.DEX }]
          : [{ n: 'Draconic Resilience', v: 10, base: true }, { n: 'Dexterity', v: m.DEX }, { n: 'Charisma', v: m.CHA }]
      );
    if (sp && sp[2]) opts.push([{ n: sp[1], v: sp[2], base: true }, ...(sp[3] ? [{ n: ABL[sp[3]], v: m[sp[3]] }] : [])]);

}

    const B = JSON.parse(JSON.stringify(HB));

    ch.classes.forEach(x => (x.sub = ''));

    return '';

    ? `<div class="sm" style="margin-top:8px;line-height:1.45;color:var(--mut)">Initiative doesn't know the <b>${esc(c.sub.trim())}</b> features yet. Add the ones you use under Features, with “Missing something? Add it”.</div>`

/* ---------- builder: apply ---------- */
function hbApply(B, keepFight) {
  const ch = hbBuild(B),
    old = S.char;
  if (old && old.source === 'hand' && keepFight) {
    // edited, or the edition switched: keep what's been used
    if (old.hp) {
      const lost = old.hp.max - old.hp.cur;
      ch.hp.cur = Math.max(0, Math.min(ch.hp.max, ch.hp.max - lost));
      ch.hp.temp = old.hp.temp || 0;
    }
    Object.entries(old.slots || {}).forEach(([k, v]) => {
      if (ch.slots[k]) ch.slots[k].used = Math.min(ch.slots[k].max, v.used || 0);
    });
    Object.values(old.res || {}).forEach(r => {
      const n = ch.res[r.k];
      if (n) n.cur = Math.max(0, Math.min(n.max, n.max - ((r.max || 0) - (r.cur || 0))));
    });
    ch.spells.push(...(old.spells || []).filter(x => x.added && !ch.spells.some(y => y.n === x.n)));
    ch.feats.push(...(old.feats || []).filter(x => x.custom && !x.hid));
    ch.items = [
      ...ch.items.filter(i => !(old.items || []).some(o => o.n === i.n)),
      ...(old.items || [])
        .filter(o => !o.potion || ch.items.some(i => i.n === o.n))
        .map(o => {
          const n = ch.items.find(i => i.n === o.n);
          return n && o.potion ? { ...o, q: Math.min(o.q, n.q) } : o;
        })
    ];
    Object.assign(ch, {
      rules: old.rules || {},
      strict: old.strict,
      strictTouched: old.strictTouched,
      insp: old.insp,
      portent: old.portent,
      ward: old.ward,
      wardMade: old.wardMade
    });
    S = { ...S, char: ch };
  } else {
    shelfKeep(ch);
    S = { char: ch, conc: null, cond: freshCond(), c: newCombat(), ws: null };
  }
  if (S.shil) applyShil();
  render();
}

// scores: point-buy start, then the usual Ability Score Improvements at 4, 8, 12, 16 and 19
function pgScores(p, L) {
  const a = { STR: 10, DEX: 10, CON: 10, INT: 10, WIS: 10, CHA: 10 };
  a[p.main] = 16;
  a[p.sec] = 14;
  a[p.third] = 14;
  ABN.filter(x => ![p.main, p.sec, p.third].includes(x)).forEach((x, i) => (a[x] = [12, 10, 8][i]));
  [4, 8, 12, 16, 19]
    .filter(l => l <= L)
    .forEach(() => {
      if (a[p.main] < 20) a[p.main] = Math.min(20, a[p.main] + 2);
      else if (a[p.sec] < 20) a[p.sec] = Math.min(20, a[p.sec] + 2);
      else a[p.third] = Math.min(20, a[p.third] + 2);
    });
  return a;
}
function pregen(k, L, name, ed) {
  const p = PG[k];
  if (!p) return null;

  B.ed = ed;
  B.name = name || DEMO[k].name;
  B.cls = [{ n: p.n, lvl: L, sub: ed === '2014' && p.sub14 ? p.sub14 : p.sub }];
  B.ab = pgScores(p, L);
  B.pregen = true;
  const m = {};
  ABN.forEach(a => (m[a] = Math.floor((B.ab[a] - 10) / 2)));
  [B.arm, B.shield] = p.arm(L);
  B.wp = p.wp(L);
  B.skills = p.sk || {};
  B.on = (p.on || []).slice();
  B.potions = L >= 11 ? 2 : 1;
  if (p.sp) {
    const lib = spLib(ed, L),
      top = Math.max(0, hbMaxSp(B)),
      have = new Set(lib.map(s => s.n + '|' + s.lvl));
    B.sp = p.sp.filter(n => {
      const s = lib.find(x => x.n === n);
      return s && (s.lvl === 0 || s.lvl <= top);
    });
  }
  return B;
}

    );

  pgLvl(d) {
    PG_LVL = Math.max(1, Math.min(20, PG_LVL + +d));

      localStorage.setItem('initiative-pglvl', PG_LVL);
    } catch (e) {}
    const ch = CH();
    if (ch.build && ch.build.pregen && PG[ch.cls]) {

/* ---------- your characters: switching never loses one ----------
   Whenever a different character replaces an imported or built one (a ready-made pick, a demo,
   another import, a new build), the old one is kept on this device with its whole state
   (HP, slots, uses, conditions). The home screen's "Change character" lists them to switch back.
   Kept in its own localStorage key, so starting fresh never clears it. */
const SHELF_KEY = 'initiative-shelf',
  SHELF_MAX = 6;
function shelf() {
  try {
    return JSON.parse(localStorage.getItem(SHELF_KEY) || '[]');
  } catch (e) {
    return [];
  }
}
function shelfSave(L) {
  try {
    localStorage.setItem(SHELF_KEY, JSON.stringify(L.slice(0, SHELF_MAX)));
  } catch (e) {}
}
const charId = ch =>
  !ch ? '' : ch.ddbId ? 'ddb:' + ch.ddbId : (ch.source || '') + ':' + (ch.name || '') + ':' + (ch.cls || '');
const keepable = ch => ch && ch.source !== 'demo';
// call before S.char is replaced by newCh (null = unknown yet: always keep)
function shelfKeep(newCh) {
  const cur = S && S.char;
  if (!keepable(cur) || (newCh && charId(newCh) === charId(cur))) return false;
  const L = shelf().filter(x => x.id !== charId(cur));
  L.unshift({ id: charId(cur), n: cur.name, line: shelfLine(cur), at: Date.now(), S: JSON.parse(JSON.stringify(S)) });
  shelfSave(L);
  SHELF_NOTE = cur.name;
  return true;
}
// name of a character just kept, so the next toast can say it's safe
let SHELF_NOTE = '';
function shelfToast() {
  if (!SHELF_NOTE) return '';
  const n = SHELF_NOTE;
  SHELF_NOTE = '';
  return `<br><span class="mut">${esc(n)} is kept under Change character → Your characters</span>`;
}
function shelfLine(ch) {
  const src = ch.source === 'ddb' ? 'D&D Beyond' : ch.build && ch.build.pregen ? 'Ready-made' : 'Built by hand';
  return `Level ${ch.level || '?'} ${ch.multi || (CLS[ch.cls] ? CLS[ch.cls].n : '')} · ${src}`;
}
function shelfCard() {
  const L = shelf().filter(x => x.id !== charId(CH()));
  if (!L.length) return '';
  return `<div class="xs mut" style="margin:14px 0 8px">Your characters</div>
  ${L.map(
    (x, i) => `<div class="card row between" style="margin-top:8px;gap:10px"><div style="min-width:0"><div style="font-weight:800">${esc(x.n)}</div><div class="sm mut">${esc(x.line)}</div></div>
    <div class="row" style="gap:6px"><button class="btn pri" style="width:auto;padding:8px 14px" data-act="shelfLoad" data-arg="${esc(x.id)}">Play</button>
    <button class="iconbtn" style="width:34px;height:34px" data-act="shelfDelAsk" data-arg="${esc(x.id)}" aria-label="Remove">✕</button></div></div>`
  ).join('')}`;
}
// asked before a ready-made or demo pick replaces a character the player brought in
function replaceAskSheet() {
  const ch = CH(),
    k = REPLACE_K;
  return `<p style="line-height:1.5;margin:4px 0 12px">This swaps <b>${esc(ch.name)}</b> for a ready-made level ${PG_LVL} ${CLS[k].n}.</p>
  <p class="sm mut" style="line-height:1.5;margin-bottom:14px">${esc(ch.name)} isn't lost: they stay under Change character → Your characters, exactly as they are now.</p>
  <button class="btn pri" data-act="replaceGo">Play the ${CLS[k].n}</button>
  <button class="btn ghost" style="margin-top:8px" data-act="closeSheet">Keep playing ${esc(ch.name)}</button>`;
}
let REPLACE_K = '';
Object.assign(ACT, {
  shelfLoad(id) {
    const L = shelf(),
      x = L.find(y => y.id === id);
    if (!x) return;
    shelfKeep(x.S.char);
    const rest = shelf().filter(y => y.id !== id);
    shelfSave(rest);

      <button class="btn" style="color:var(--bad,#e5484d)" data-act="shelfDel">Remove ${esc(x.n)}</button><button class="btn ghost" style="margin-top:8px" data-act="closeSheet">Keep</button>`);
  },

  },
  pickReady(k) {
    const ch = CH(),
      brought = ch.source === 'ddb' || (ch.source === 'hand' && !(ch.build && ch.build.pregen));
    if (!brought) return ACT.quick(k);

  replaceGo() {

let SHELF_DEL = '';

// characters saved before armour & shield existed: give them the same itemised AC as a fresh build.
// Their AC number only changes if the old one came from a ready-made table; anything the player
// changed by hand (+1/−1) is kept.
function acMigrate(ch) {
  if (!ch) return;
  try {
    if (ch.source === 'hand' && ch.build) {
      const B = ch.build;
      if (B.pregen && B.arm == null && PG[ch.cls] && PG[ch.cls].arm) {
        [B.arm, B.shield] = PG[ch.cls].arm((B.cls[0] || {}).lvl || ch.level);
        delete B.ac;
      }
      if ((ch.acParts || []).some(p => p.n === 'From your sheet' && !p.todo) || (B.pregen && !(ch.acParts || []).length)) {
        const A = hbAC(B),
          was = ch.acImported != null ? ch.acImported : ch.ac;
        ch.acParts = A.parts;
        if (A.ac !== was) {
          ch.ac += A.ac - was;
          if (ch.acImported != null) ch.acImported = A.ac;
        }
      }
    }
    // D&D Beyond imports from before the shield switch: mark the shield line
    if (ch.source === 'ddb')
      (ch.acParts || []).forEach(p => {
        if (!p.base && p.aid == null && /^shield\b/i.test(p.n) && !/faith/i.test(p.n)) p.shield = true;
      });
  } catch (e) {}
}
