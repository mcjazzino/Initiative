:root{--bg:#0d0c11;--card:#17151d;--card2:#1f1c27;--txt:#efeaf4;--mut:#9a93a6;--acc:#9B8CFF;--soft:rgba(155,140,255,.14);--line:rgba(155,140,255,.45);--bad:#f25f5c;--good:#4fd1a5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif;font-size:15px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--acc)}
#app{max-width:520px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;min-height:40px}
.appname{font-family:Cinzel,serif;font-weight:700;font-size:16px;letter-spacing:.14em;color:var(--mut)}
.appname span{color:var(--acc)}
.back{color:var(--mut);font-weight:700;font-size:14px;text-decoration:none;padding:8px 0}
h1{font-family:Cinzel,serif;font-size:22px;margin:4px 0 14px}
h2{font-family:Cinzel,serif;font-size:24px;margin:0 0 6px}
.card{background:var(--card);border:1px solid #2c2836;border-radius:16px;padding:14px 16px;line-height:1.5}
.pick{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid #2c2836;border-radius:16px;padding:12px 14px;margin-bottom:10px;transition:.15s}
.pick:active{transform:scale(.98);border-color:var(--acc)}
.pick b{display:block;font-size:16px}.pick small{display:block;color:var(--mut);font-size:13px;margin-top:2px;line-height:1.4}
.badge{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:Cinzel,serif;font-weight:800;font-size:20px;color:#15121a}
.cr{flex:none;width:48px;text-align:center;font-size:11px;color:var(--mut);font-weight:700;line-height:1.2}.cr b{font-size:17px;color:#f25f5c;display:inline}
.fine{color:var(--mut);font-size:12.5px;line-height:1.5;margin-top:14px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-bottom:14px}
.side{background:var(--card);border:1px solid #2c2836;border-radius:16px;padding:10px 12px;min-width:0}
.side.now{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.side.them.now{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.side b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side small{display:block;color:var(--mut);font-size:12.5px;margin:1px 0 6px}.side em{color:#f2c14e;font-style:normal;font-weight:700}
.side .hp{display:block;font-weight:800;font-size:18px;margin-top:4px;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:5px;background:#2a2633;overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
.bar.mine i{background:var(--acc)}.bar.theirs i{background:var(--bad)}
.dist{font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;text-align:center;width:62px;line-height:1.3}
.turn{background:var(--card);border:1px solid #2c2836;border-radius:18px;padding:12px 14px 14px}
.turn.wait{display:flex;align-items:center;gap:10px;color:var(--mut);font-weight:700}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--bad);border-top-color:transparent;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.chips span{font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--acc)}
.chips span.used{background:#221f29;color:#5e586a;text-decoration:line-through}
.chips span.hot{background:var(--acc);color:#15121a}
.sec{font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px}
.act{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid #2c2836;border-radius:12px;padding:10px 12px;margin-bottom:6px}
.act b{font-size:15px}.act small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px}
.act:not(:disabled):active{border-color:var(--acc)}
.act:disabled{opacity:.38}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid .act{margin:0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:16px;border:1px solid #2c2836;margin-top:8px}
.btn.pri{background:var(--acc);color:#15121a;border:0}
.endt{margin-top:12px}
.end{text-align:center;background:var(--card);border:1px solid #2c2836;border-radius:18px;padding:18px 16px}
.end.win{border-color:var(--good)}.end.win h2{color:var(--good)}.end.lose{border-color:var(--bad)}.end.lose h2{color:var(--bad)}
.end p{color:var(--mut);line-height:1.5;margin:0 0 6px}
.log>div{font-size:13.5px;line-height:1.5;padding:8px 10px;border-radius:10px;margin-bottom:4px;background:#141219}
.log>div span{display:inline-block;font-size:11px;font-weight:800;color:#5e586a;margin-right:6px}
.log .me{border-left:3px solid var(--acc)}.log .them{border-left:3px solid var(--bad)}.log .sys{color:var(--mut)}
.log>div:first-child{background:#1c1924}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translate(-50%,30px);opacity:0;background:#2a2633;padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

.turn.ask{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 8px 30px rgba(0,0,0,.4);animation:pop .2s ease-out}
.turn.ask .sec{margin-top:0;color:var(--acc)}
.turn.ask p{margin:0 0 10px;line-height:1.5;font-size:15px}
.act.react{border-color:var(--line);background:var(--soft)}
.act.react b{color:var(--acc)}
.fine.rx{margin:10px 0 0}
@keyframes pop{from{transform:scale(.97);opacity:.4}}

.fx{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-6px 0 12px}
.fx span{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--acc);border:1px solid transparent}
.fx span.conc{border-color:var(--line)}
.fx small{font-size:11.5px;color:var(--mut);font-weight:700}
.act small em{color:var(--acc);font-style:normal;font-weight:800}

</style>
</head>

/* Initiative Arena: take a character from Initiative into a mock fight against one monster.

const $ = s => document.querySelector(s);

/* ---------- dice ---------- */
function d(n) {

  parts.forEach(p => {
    const sg = p[0] === '-' ? -1 : 1,
      q = p.replace(/^[+-]/, ''),
      m = q.match(/^(\d*)d(\d+)$/i);
    if (m) {

        L = Array.from({ length: n }, () => d(+m[2]));
      out.total += sg * L.reduce((a, b) => a + b, 0);
      out.txt.push(`${n}d${m[2]} (${L.join(', ')})`);
    } else if (+q) {
      out.total += sg * +q;
      out.txt.push(sg < 0 ? '−' + q : '+' + q);

}

  const L = [];

    (JSON.parse(localStorage.getItem('initiative-shelf') || '[]') || []).forEach(x => x.S && x.S.char && L.push(x.S.char));
  } catch (e) {}
  const seen = new Set();
  return L.filter(c => {
    const id = c.name + '|' + c.cls + '|' + c.level;
    if (seen.has(id)) return false;

}

// what a character can do in the arena, read from Initiative's own data

    if (L) return spells.push({ s, kind: 'last', L });

    const t = (s.d || '').replace(/Always prepared ·[^.]*\.\s*/, ''),
      ab = x => m[AB.indexOf(x)] || 0,

    else if ((r = t.match(/(\w+) darts of (\d*d\d+\s*\+\s*\d+) (\w+) that always hit/i)))
      spells.push({ s, kind: 'auto', n: WORDS[r[1].toLowerCase()] || +r[1] || 1, dmg: r[2], type: r[3] });

      shield: sp('shield'),
      absorb: sp('absorb elements'),
      rebuke: sp('hellish rebuke'),
      uncanny: (ch.feats || []).some(f => /^Uncanny Dodge/.test(f.n || '')) || (ch.cls === 'rogue' && !ch.multi && (ch.level || 0) >= 5)
    };

/* ---------- the fight ---------- */

const PICK = { ch: null };

    pInit = d20(),
    mInit = d20(),

    mI = mInit.nat + mod(mon.ab[1]);

    fx: {}, // lasting spells in play

      note = '';

      ? `<button class="act ba" ${!t.bonus ? 'disabled' : ''} onclick="swAttack()"><b>Spiritual Weapon</b><small>Bonus · ${sgn(F.fx.sw.atk)} · ${esc(F.fx.sw.dmg)} force</small></button>`
      : '');
  const spBtns = K.spells
    .map((S, i) => {
      const s = S.s,
        isB = s.t === 'B',
        lvl = s.lvl || 0,
        hasSlot = !lvl || Object.entries(F.me.slots).some(([k, x]) => (k === 'P' ? x.lvl >= lvl : +k >= lvl) && x.max - (x.used || 0) > 0),
        on = S.kind === 'last' && F.fx[S.L.id],
        off = (isB ? !t.bonus : !t.action) || !hasSlot || (S.melee && !F.close) || on,
        X = S.kind === 'last' ? null : scaled(S, lvl),
        what = S.kind === 'last'
          ? `${concOf(S) ? 'Concentration · ' : ''}${S.L.what(ed14())}${baseDmg(S) && S.L.id !== 'sw' ? ` · ${baseDmg(S)} ${S.L.type}` : ''}${on ? ' · <em>active</em>' : concOf(S) && F.me.conc ? ` · ends ${esc(F.me.conc)}` : ''}`
          : S.kind === 'heal' ? `heal ${S.dmg}` : S.kind === 'save' ? `${AB[S.ab]} save DC ${S.dc}, ${S.dmg} ${S.type}` : S.kind === 'auto' ? `${S.n}× ${S.dmg} ${S.type}, always hits` : `${S.n > 1 ? S.n + '× ' : ''}${sgn(S.atk)} · ${S.dmg} ${S.type}`;
      return `<button class="act ${isB ? 'ba' : ''}" ${off ? 'disabled' : ''} onclick="castSpell(${i})"><b>${esc(s.n)}</b><small>${lvl ? 'Level ' + lvl + ' · ' : 'Cantrip · '}${isB ? 'Bonus · ' : ''}${S.kind === 'last' ? what : esc(what)}${upOf(S) && lvl ? ' · can upcast' : ''}${!hasSlot ? ' · no slot' : ''}</small></button>`;
    })
    .join('');
  const e14 = c.edition === '2014',
    R = K.R,
    rList = [R.shield && 'Shield', R.absorb && 'Absorb Elements', R.rebuke && 'Hellish Rebuke', R.uncanny && 'Uncanny Dodge'].filter(Boolean),
    A = F.ask,
    askCard = A
      ? `<div class="turn ask"><div class="sec">${A.head || `Your reaction${who() === 'me' ? '' : ` · the ${esc(M.n)}’s turn`}`}</div><p>${A.text}</p>
        ${A.opts.map((o, i) => `<button class="act react" onclick="answer(${i})"><b>${esc(o.b)}</b><small>${esc(o.s)}</small></button>`).join('')}
        <button class="btn" onclick="answer(-1)">${esc(A.noLabel)}</button></div>`
      : '';
  return `<div class="top"><button class="back" onclick="if(confirm('Leave this fight?')){SCREEN='mon';show()}">‹ Leave</button><div class="appname">Round ${F.round}</div></div>
  <div class="vs">
    <div class="side me ${who() === 'me' ? 'now' : ''}"><b>${esc(c.name)}</b><small>AC ${myAC()}${F.me.acb ? ' (Shield)' : ''}${F.me.prone ? ' · <em>prone</em>' : ''}${F.me.dodge ? ' · dodging' : ''}</small>${bar(F.me.hp, F.me.max, 'mine')}<span class="hp">${F.me.hp}/${F.me.max}</span></div>
    <div class="dist">${F.close ? 'In reach' : '~30 ft apart'}</div>
    <div class="side them ${who() === 'them' ? 'now' : ''}"><b>${esc(M.n)}</b><small>AC ${M.ac}</small>${bar(F.them.hp, F.them.max, 'theirs')}<span class="hp">${F.them.hp}/${F.them.max}</span></div>
  </div>${fxRow()}
  ${
    F.over
      ? `<div class="end ${F.over}"><h2>${F.over === 'win' ? 'Victory!' : 'You drop to 0 HP'}</h2><p>${F.over === 'win' ? `The ${M.n} falls in round ${F.round}.` : `The ${M.n} wins this one, in round ${F.round}. At a real table you'd now roll death saves.`}</p>
        <button class="btn pri" onclick="startFight(F.ch,F.mon)">Fight again</button><button class="btn" onclick="SCREEN='mon';show()">Another monster</button></div>`
      : A
        ? askCard
        : mine
        ? `<div class="turn"><div class="chips"><span class="${t.action ? '' : 'used'}">Action</span><span class="${t.bonus ? '' : 'used'}">Bonus</span><span class="${t.move ? '' : 'used'}">Move</span>${rList.length ? `<span class="${F.me.react ? '' : 'used'}">Reaction</span>` : ''}${F.me.absorbHit ? `<span class="hot">+${esc(F.me.absorbHit.dice)} ${esc(F.me.absorbHit.type)} on a melee hit</span>` : ''}${t.attacksLeft > 0 ? `<span class="hot">${t.attacksLeft} attack${t.attacksLeft > 1 ? 's' : ''} left</span>` : ''}</div>
        <div class="sec">Attack${(c.attacks || 1) > 1 ? ` · ${c.attacks} per action` : ''}</div>${atkBtns}
        ${spBtns ? `<div class="sec">Spells${slotsTxt ? ` · ${slotsTxt}` : ''}</div>${spBtns}` : ''}
        <div class="sec">Other</div>
        <div class="grid">
          <button class="act" ${!t.move ? 'disabled' : ''} onclick="move(${!F.close})"><b>${F.close ? 'Step back' : 'Move in'}</b><small>${F.close ? 'provokes an opportunity attack' : 'uses your move'}</small></button>
          ${F.close ? `<button class="act" ${!t.action || !t.move ? 'disabled' : ''} onclick="move(false,true)"><b>Disengage</b><small>Action: back off safely</small></button>` : ''}
          <button class="act" ${!t.action ? 'disabled' : ''} onclick="dodge()"><b>Dodge</b><small>Action: attacks against you have disadvantage</small></button>
          ${F.me.pots ? `<button class="act" ${!(e14 ? t.action : t.bonus) ? 'disabled' : ''} onclick="drinkPotion()"><b>Healing potion ×${F.me.pots}</b><small>${e14 ? 'Action' : 'Bonus Action'}</small></button>` : ''}
          ${F.me.second ? `<button class="act" ${!t.bonus ? 'disabled' : ''} onclick="secondWind()"><b>Second Wind</b><small>Bonus: heal 1d10+${c.level}</small></button>` : ''}
        </div>
        ${rList.length ? `<p class="fine rx">Reactions: ${rList.join(', ')}. The fight stops and asks you when one applies.</p>` : ''}
        <button class="btn pri endt" onclick="endTurn()">End turn</button></div>`
        : `<div class="turn wait"><div class="spin"></div> The ${esc(M.n)} is acting…</div>`
  }
  <div class="sec">Battle log</div>
  <div class="log">${F.log.map(l => `<div class="${l.who}"><span>R${l.r}</span>${l.html}</div>`).join('')}</div>`;
}
show();

</script>
</body>
</html>
