/* Initiative's two looks: spellbook dark, vellum & gold light */
:root{--page:#050507;--bg:#0F0E14;--card:#18161F;--card2:#201D29;--edge:#29262F;--edge2:#2F2B39;--fill:#25222D;--txt:#EFEAF4;--mut:#A39CB0;--dim:#5E586A;
  --acc:#9B8CFF;--acct:#9B8CFF;--soft:rgba(155,140,255,.14);--line:rgba(155,140,255,.45);--bad:#f2545b;--good:#3fcf8e;--warn:#f2b84b;--ink:#15121A;--wash:rgba(255,255,255,.05);--shade:rgba(0,0,0,.45)}
:root[data-theme="light"]{--page:#E6DCC5;--bg:#F3ECDC;--card:#FBF7EC;--card2:#F6EFDD;--edge:#E0D2AF;--edge2:#D9C9A3;--fill:#EDE3CB;--txt:#2A3328;--mut:#5C6356;--dim:#8C8E80;
  --bad:#C2353D;--good:#1F8A5B;--warn:#A8650F;--wash:rgba(70,50,15,.05);--shade:rgba(90,65,20,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Manrope,system-ui,sans-serif;font-size:15px}
body{background:radial-gradient(120% 50% at 50% -10%,var(--soft),transparent 60%),var(--bg);min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:var(--acct)}
#app{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) 16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;min-height:40px}
.appname{font-family:Cinzel,serif;font-weight:700;font-size:16px;letter-spacing:.14em;color:var(--mut)}
.appname span{color:var(--acct)}
.back{color:var(--mut);font-weight:700;font-size:14px;text-decoration:none;padding:8px 0}
h1{font-family:Cinzel,serif;font-size:22px;margin:4px 0 14px}
h2{font-family:Cinzel,serif;font-size:24px;margin:0 0 6px}
.card{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:14px 16px;line-height:1.5}
.pick{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:12px 14px;margin-bottom:10px;transition:.15s}
.pick:active{transform:scale(.98);border-color:var(--acc)}
.pick b{display:block;font-size:16px}.pick small{display:block;color:var(--mut);font-size:13px;margin-top:2px;line-height:1.4}
.badge{flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:Cinzel,serif;font-weight:800;font-size:20px;color:#15121a}
.cr{flex:none;width:52px;text-align:center;font-size:11px;color:var(--mut);font-weight:700;line-height:1.2}.cr b{font-size:16px;color:var(--bad);display:inline;white-space:nowrap}
.tabs{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--card);border:1px solid var(--edge);border-radius:14px;padding:4px;margin-bottom:12px}
.tabs button{padding:10px;border-radius:10px;font-weight:800;font-size:14px;color:var(--mut)}
.tabs button.on{background:var(--acc);color:var(--ink)}
.fine{color:var(--mut);font-size:12.5px;line-height:1.5;margin-top:14px}

/* you and the monsters */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:start;margin-bottom:12px}
.vs.many{grid-template-columns:1fr}
.foes{display:grid;gap:6px;grid-template-columns:1fr}
.vs.many .foes{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.side,.foe{background:var(--card);border:1px solid var(--edge);border-radius:16px;padding:10px 12px;min-width:0;text-align:left;width:100%;display:block}
.side.now{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc)}
.foe.now{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.foe.tg{background:linear-gradient(var(--soft),var(--soft)),var(--card);border-color:var(--line)}
.foe.tg b::before{content:'◎ ';color:var(--acct)}
.foe.dead{opacity:.4}
.side b,.foe b{display:block;font-size:14.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.side small,.foe>small{display:block;color:var(--mut);font-size:12.5px;margin:1px 0 6px}.side em{color:var(--warn);font-style:normal;font-weight:700}
.foe em{display:block;font-style:normal;font-size:11.5px;font-weight:800;color:var(--warn);margin-top:3px;text-transform:uppercase;letter-spacing:.04em}
.hp{display:block;font-weight:800;font-size:18px;margin-top:4px;font-variant-numeric:tabular-nums}
.side .hp small,.foe .hp small{display:inline;font-size:13px;color:var(--mut);font-weight:700;margin:0}
.hp i{font-style:normal;font-size:12px;font-weight:800;padding:2px 7px;border-radius:999px;vertical-align:2px}
.hp .tmp{background:var(--soft);color:var(--acct)}.hp .ward{background:var(--fill);color:var(--mut)}
.bar{height:8px;border-radius:5px;background:var(--fill);overflow:hidden}.bar i{display:block;height:100%;border-radius:5px;transition:width .4s}
.bar.mine i{background:var(--acc)}.bar.theirs i{background:var(--bad)}

.turn{background:var(--card);border:1px solid var(--edge);border-radius:18px;padding:12px 14px 14px}
.turn.wait{display:flex;align-items:center;gap:10px;color:var(--mut);font-weight:700}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--bad);border-top-color:transparent;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}
.chips span{font-size:12.5px;font-weight:800;padding:5px 10px;border-radius:999px;background:var(--soft);color:var(--acct)}
.chips span.used{background:var(--fill);color:var(--dim);text-decoration:line-through}
.chips span.hot{background:var(--acc);color:var(--ink)}
.target{margin:10px 0 0;font-size:13.5px;color:var(--mut)}.target b{color:var(--txt)}.target span{font-size:12.5px}
.sec{font-size:11.5px;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.08em;margin:14px 0 6px}
.act{display:block;width:100%;text-align:left;background:var(--card2);border:1px solid var(--edge2);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.act b{font-size:15px}.act small{display:block;color:var(--mut);font-size:12.5px;margin-top:2px;line-height:1.35}
.act.ba{border-left:3px solid var(--line)}
.act:not(:disabled):active{border-color:var(--acc)}
.act:disabled{opacity:.38}
.act.on{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.grid .act{margin:0}
.btn{display:flex;align-items:center;justify-content:center;width:100%;padding:14px;border-radius:14px;font-weight:800;font-size:16px;border:1px solid var(--edge2);margin-top:8px}
.btn.pri{background:var(--acc);color:var(--ink);border:0;box-shadow:0 10px 30px -10px var(--acc)}
.endt{margin-top:12px}
.end{text-align:center;background:var(--card);border:1px solid var(--edge);border-radius:18px;padding:18px 16px}
.end.win{border-color:var(--good)}.end.win h2{color:var(--good)}.end.lose{border-color:var(--bad)}.end.lose h2{color:var(--bad)}
.end p{color:var(--mut);line-height:1.5;margin:0 0 6px}
.log>div{font-size:13.5px;line-height:1.5;padding:8px 10px;border-radius:10px;margin-bottom:4px;background:var(--wash)}
.log>div span{display:inline-block;font-size:11px;font-weight:800;color:var(--dim);margin-right:6px}
.log .me{border-left:3px solid var(--acc)}.log .them{border-left:3px solid var(--bad)}.log .sys{color:var(--mut)}
.log>div:first-child{background:var(--card)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 20px);transform:translate(-50%,30px);opacity:0;background:var(--card2);border:1px solid var(--edge2);box-shadow:0 10px 30px var(--shade);padding:10px 16px;border-radius:12px;font-weight:700;font-size:14px;transition:.25s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}

.turn.ask{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc),0 8px 30px var(--shade);animation:pop .2s ease-out}
.turn.ask .sec{margin-top:0;color:var(--acct)}
.turn.ask p{margin:0 0 10px;line-height:1.5;font-size:15px}
.act.react{border-color:var(--line);background:var(--soft)}
.act.react b{color:var(--acct)}
.fine.rx{margin:10px 0 0}
@keyframes pop{from{transform:scale(.97);opacity:.4}}

.fx{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:-4px 0 12px}
.fx span{font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:999px;background:var(--soft);color:var(--acct);border:1px solid transparent}
.fx span.conc{border-color:var(--line)}
.fx span.rage,.fx span.bad{background:rgba(229,83,47,.14);color:var(--bad)}
.fx small{font-size:11.5px;color:var(--mut);font-weight:700}
.act small em{color:var(--acct);font-style:normal;font-weight:800}

</style>
</head>

/* ---------- class features ---------- */
function useFeat(id) {

        <div class="sec">Attack${perAction() > 1 ? ` · ${perAction()} per action` : ''}</div>${atkBtns}
        ${spBtns ? `<div class="sec">Spells${slotsTxt ? ` · ${slotsTxt}` : ''}</div>${spBtns}` : ''}
        ${feat ? `<div class="sec">${esc(CL(c.cls).n)} features</div><div class="grid">${feat}</div>` : ''}
        <div class="sec">Other</div>
        <div class="grid">
          ${btn(`move(${!f.close})`, f.close ? 'Step back' : `Move in${many ? ' on ' + esc(f.n) : ''}`, f.close ? (t.diseng ? 'safely: you disengaged' : 'provokes opportunity attacks') : 'uses your move', !t.move)}
          ${anyClose() && !t.diseng ? btn(`move(false,true)`, 'Disengage', 'Action: back off safely', !t.action || !t.move) : ''}
          ${btn(`dodge()`, 'Dodge', 'Action: attacks against you have disadvantage', !t.action)}
          ${F.me.pots ? btn(`drinkPotion()`, `Healing potion ×${F.me.pots}`, ed14() ? 'Action' : 'Bonus Action', !(ed14() ? t.action : t.bonus)) : ''}
        </div>
        ${rList.length ? `<p class="fine rx">Reactions: ${rList.join(', ')}. The fight stops and asks you when one applies.</p>` : ''}
        <button class="btn pri endt" onclick="endTurn()">End turn</button></div>`
      : `<div class="turn wait"><div class="spin"></div> ${who() === 'me' ? 'You can’t act…' : `The ${esc(F.order[F.turn].mon.n)}${F.foes.filter(x => x.mon.k === F.order[F.turn].mk && x.hp > 0).length > 1 ? 's are' : ' is'} acting…`}</div>`
  }
  <div class="sec">Battle log</div>
  <div class="log">${F.log.map(l => `<div class="${l.who}"><span>R${l.r}</span>${l.html}</div>`).join('')}</div>`;
}
show();

</script>
</body>
</html>
